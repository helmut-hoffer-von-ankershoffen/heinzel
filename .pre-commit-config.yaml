# Install with `make setup`. Hooks run tools from the project environment, so versions match uv.lock.
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^uv\.lock$ # generated dependency metadata is checked by uv-lock, including a fresh scaffold's lock
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents] # pnpm-lock.yaml is several documents
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: uv-lock
        name: dependency lock matches project metadata
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: gitleaks # credentials: API keys, tokens, private keys (confidential terms: scripts/check_confidentiality.py)
        name: gitleaks (credentials in the staged changes)
        # The binary pinned in scripts/tools.toml, the same one `make secrets` runs over the history in CI.
        entry: uv run --quiet --script scripts/tools.py run gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^plugins/
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: ^plugins/
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        exclude: ^plugins/
      - id: confidentiality
        name: confidential terms
        entry: uv run --script scripts/check_confidentiality.py
        language: system
      - id: confidentiality-identity
        name: confidential terms in the author and committer
        entry: uv run --script scripts/check_confidentiality.py --identity
        language: system
        pass_filenames: false
        always_run: true
      - id: confidentiality-branch
        name: confidential terms in the branch name
        entry: uv run --script scripts/check_confidentiality.py --branch
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: confidentiality-commit-msg
        name: confidential terms in the commit message
        entry: uv run --script scripts/check_confidentiality.py --commit-msg
        language: system
        stages: [commit-msg]
      - id: check-fast
        name: make check-fast (format, lint, contracts, generated files, unit tests)
        entry: bash -c 'test -f pyproject.toml || exit 0; exec make check-fast' # prek also runs this from template/, which has no project
        language: system
        pass_filenames: false
        exclude: ^plugins/
        stages: [pre-push]
      - id: owning-plugin-checks
        name: owning plugin lint and unit tests
        entry: uv run --no-project --no-build --python 3.14 python scripts/plugin_tooling.py --toolkit
        args:
          - heinzel-plugin-tools @ https://github.com/helmut-hoffer-von-ankershoffen/heinzel-plugins/releases/download/tools-v0.2.1/heinzel_plugin_tools-0.2.1-py3-none-any.whl#sha256=eebaf555c0c3b39cb13d28ae5ea146ec459e06d1b96cf8ba4499ffea4247aab7
          - hz-plugin
          - check-changed
          - --git-hook
        language: system
        pass_filenames: false
        always_run: true # Git supplies deleted plugin paths; unrelated changes are a no-op.
        require_serial: true
        stages: [pre-commit, pre-push]
      - id: commitizen
        name: conventional commit message
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]
