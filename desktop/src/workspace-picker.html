<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
<title>Workspaces · Heinzelmännchen</title>
<link rel="stylesheet" href="workspace-picker.css"><script defer src="workspace-picker.js"></script>
</head><body><main>
<header><img src="workspace-brand.svg" alt="" width="78" height="78"><div><h1 aria-label="Heinzelmännchen">Heinzel<wbr>männchen</h1>
<p>Durable agents accelerating product teams,<br>like the little elves from Cologne.</p></div></header>
<section class="surface" id="chooser" aria-labelledby="heading"><div class="group">
<div class="heading"><h2 id="heading" tabindex="-1">Workspaces</h2><button id="add" aria-label="Add workspace">+</button></div>
<div id="rows" class="rows" role="list" aria-label="Workspaces"></div>
<output id="status" aria-live="polite"></output><button hidden id="retry">Try Again</button>
</div></section>
<section class="surface" id="information" aria-labelledby="information-title" hidden><div class="group">
<div class="heading"><h2 id="information-title" tabindex="-1">Information</h2><button id="back">Back</button></div>
<div class="facts"><h3>Application</h3><dl id="application"></dl><h3 id="workspace-title" hidden>Workspace</h3><dl id="workspace"></dl></div></div></section>
<footer><div id="checks"></div><div class="version"><span id="version"></span><button id="info" aria-label="Information">ⓘ</button></div></footer>
<dialog id="sheet" aria-labelledby="sheet-title"><form id="form">
<div class="heading"><h2 id="sheet-title">Add workspace</h2><button id="cancel" type="button" aria-label="Cancel">×</button></div>
<label for="link">Sign-in URL</label><div class="field"><input id="link" type="password" autocomplete="off" spellcheck="false" required aria-describedby="error">
<button id="paste" type="button">Paste</button><button id="clear" type="button" aria-label="Clear sign-in URL" hidden>×</button><button type="submit" id="submit" aria-label="Connect">→</button></div>
<output id="error" aria-live="polite"></output></form></dialog>
</main></body></html>
