# Review draft only: external queue/train/base-writer serialization is a hard precondition.
name: One-shot 650 ref update
on:
  push:
    branches: [bootstrap/one-shot-650-update]
permissions: {}
concurrency:
  group: one-shot-650-ref
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && github.actor == github.repository_owner && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REVIEWED_HELPER_SHA: ${{ vars.ONE_SHOT_650_HELPER_SHA }}
    steps:
      - name: Require separately reviewed bootstrap source
        run: test -n "$REVIEWED_HELPER_SHA" && test "$GITHUB_SHA" = "$REVIEWED_HELPER_SHA"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Update only the pinned PR ref
        run: python3 -I scripts/one_shot_650.py
