# Review draft. To use, commit this file and run.sh on a reviewed non-PR branch.
# This diagnostic does not publish required contexts or change any existing workflow.
name: Focused 650 bootstrap evidence
on:
  workflow_dispatch:
permissions: {}
jobs:
  focused:
    name: Focused 650 ${{ matrix.suite }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        suite: [python, browser]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed bootstrap source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: bootstrap
          persist-credentials: false
      - name: Checkout reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 37ea58445ac9ac73f9b698de3bd852a2821e8501
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Setup uv
        uses: ./candidate/.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Install browser runtimes
        if: matrix.suite == 'browser'
        working-directory: candidate
        run: make test-browser-deps
      - name: Run exact selection
        working-directory: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/bootstrap/research/focused-650/run.sh" '${{ matrix.suite }}'
      - name: Upload exact attempt evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: focused-650-${{ matrix.suite }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/focused-650/
          if-no-files-found: error
          retention-days: 7
