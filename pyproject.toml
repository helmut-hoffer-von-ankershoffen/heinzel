[project]
name = "heinzel"
version = "0.2.0"
description = "Heinzelmännchen: an open-source, AI-driven operating system for product development teams."
readme = "README.md"
authors = [{ name = "Helmut Hoffer von Ankershoffen", email = "helmuthva@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["cli", "typer", "pluggy", "agents", "product-development", "workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
]
dependencies = [
    "croniter>=6.2.4",
    "fastapi>=0.161",
    "keyring>=25.6",
    "mcp>=2.3",
    "packaging>=25.0",
    "platformdirs>=4.5",
    "pluggy>=1.6.0,<2",
    "pydantic>=2.12.0,<3",
    "pydantic-settings>=2.11.0,<3",
    "pyyaml>=6.0.2,<7",
    "rich>=14.2.0",
    "tomlkit>=0.13",
    "typer>=0.23.0",
    "uvicorn>=0.54",
]

[project.scripts]
hz = "heinzel.heads.cli:main"

[project.entry-points.pytest11]
heinzel = "heinzel.testing"

[project.urls]
Homepage = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel"
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[dependency-groups]
# What the unit, integration and e2e tests need, and no more: CI installs only this group for the test matrix.
test = [
    # The first-party plugins (workspace members), so their tests run in this suite; the release process bumps the
    # bounds. Test-only: `hz system plugin add <name>` installs them for users, nothing installs them by default.
    "heinzel-atlassian>=0.2.0",
    "heinzel-clock>=0.2.0",
    "heinzel-github>=0.2.0",
    "heinzel-google>=0.2.0",
    "heinzel-zoom>=0.2.0",
    "coverage>=7.12",
    "httpx>=0.28",
    "hypothesis>=6.140",
    "jsonschema>=4.26",
    "prek>=0.2",
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2.4.0,<3",
    "pytest-xdist>=3.8",
]
# Fuzzing the contract parser (`make fuzz`, weekly in CI); atheris has wheels for x86_64 Linux, Python 3.12 to 3.14.
fuzz = ["atheris>=3.1; sys_platform == 'linux' and platform_machine == 'x86_64' and python_version < '3.15'"]
dev = [
    { include-group = "test" },
    "actionlint-py>=1.7.12",
    "bump-my-version>=1.2.4,<2",
    "commitizen>=4.10.0,<5",
    "copier>=9.19",
    "git-cliff>=2.14.0,<3",
    "import-linter>=2.5",
    "mypy>=1.19.0,<3",
    "pip-audit>=2.10.0,<3",
    "pyright[nodejs]>=1.1.408", # Node.js from a locked wheel, instead of a download at the first run
    "ruff>=0.14.8,<1",
    "shellcheck-py>=0.10",
    "types-croniter>=6.2.4",
    "types-pyyaml>=6.0.12",
    "typos>=1.51",
    "zizmor>=1.31",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heinzel"]

# Ship the changelog inside the package so `hz system changelog` works from an installed wheel.
[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "heinzel/CHANGELOG.md"
"agent-skills/skills" = "heinzel/skills"

[tool.uv]
required-version = ">=0.13.0"

# First-party plugins (ADR 0017): separate distributions in plugins/, developed and released with the core.
[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
heinzel = { workspace = true }
heinzel-atlassian = { workspace = true }
heinzel-clock = { workspace = true }
heinzel-github = { workspace = true }
heinzel-google = { workspace = true }
heinzel-zoom = { workspace = true }

[tool.ruff]
line-length = 120
fix = true
extend-exclude = ["template"] # rendered and checked by `make template-test`

[tool.ruff.lint]
select = ["ALL"]
# pydoclint (DOC): docstring sections must match what the code raises, returns and yields. Preview rules, opted into
# one by one so no other preview rule sneaks in.
preview = true
explicit-preview-rules = true
extend-select = ["DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502"]
ignore = [
    "COM812",  # conflicts with the ruff formatter
    "CPY001",  # no copyright header in OSS files
    "D203",    # incompatible with D211
    "DOC201",  # a return value is documented by the type and the summary line; Returns: only when it adds meaning
    "DOC502",  # documenting exceptions raised by callees is useful for callers
    "D213",    # incompatible with D212
    "FBT001",  # boolean positional arguments are idiomatic for Typer options
    "FBT002",  # same as FBT001
    "ISC001",  # conflicts with the ruff formatter
    "TD003",   # todos don't need an issue link
    "FIX002",  # todos are allowed
]

[tool.ruff.lint.per-file-ignores]
".claude/hooks/*.py" = [
    "D103",    # hook entry points are documented by the module docstring
    "INP001",  # hooks are scripts, not a package
    "S603",    # subprocess calls with fixed argument lists
    "S607",    # tools (uv, git, make) are resolved from PATH on purpose
    "T201",    # hooks talk to the agent through stdout/stderr
]
"fuzz/*.py" = [
    "INP001",  # fuzz targets are scripts, not a package
]
"scripts/*.py" = [
    "INP001",  # scripts are not a package
    "T201",    # scripts report on stdout/stderr
]
"**/tests/**/*.py" = [
    "ANN",     # fixtures and tests don't need full annotations
    "DOC",     # test docstrings describe behaviour, not interfaces
    "ARG",     # fixtures are used for their side effects
    "D",       # test names are the documentation
    "INP001",  # tests are not a package
    "PLC0415", # local imports keep fixtures isolated
    "PLR2004", # magic values are fine in assertions
    "S101",    # asserts are what tests do
    "S105",    # fake tokens and passwords are test data (credentials, adapters for tracker and document services)
    "S106",    # same as S105, passed as arguments
    "S603",    # subprocess calls with trusted input
    "S607",    # partial executable paths (uv, hz) are resolved from PATH on purpose
    "SLF001",  # private access is needed for solitary unit tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
mypy_path = ["src", "plugins/heinzel-atlassian/src", "plugins/heinzel-clock/src", "plugins/heinzel-github/src", "plugins/heinzel-google/src", "plugins/heinzel-zoom/src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = ["src", "plugins/*/src"]

[[tool.mypy.overrides]]
module = ["atheris"] # no type information; installed only for `make fuzz` on Linux
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests", "plugins"]
norecursedirs = ["tests/fixtures", ".hypothesis"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]
log_level = "INFO"
timeout = "15" # Fallback; heinzel.testing gives each test its level's timeout (unit 5 s, integration 15 s, e2e 120 s).
session_timeout = "900" # Nothing waits longer than this for a hung suite; make test caps unit + integration lower.
markers = [
    # Test categories, following the Aignostics Python SDK (Martin Fowler's solitary vs. sociable distinction).
    # Every test carries exactly one of them; heinzel.testing (pytest11) enforces this.
    "unit: Solitary unit tests - test one layer of a module in isolation with all collaborators mocked, except shared utils. Must pass offline. Timeout 5 s.",
    "integration: Sociable integration tests - test interactions across layers (CLI -> service -> utils) or between modules with real collaborators, real file I/O and real subprocesses. Must pass offline; external services are mocked. Timeout 15 s.",
    "e2e: End-to-end tests - complete workflows against real external services (PyPI, GitHub, a real `uv tool` install). Need network. Timeout 120 s; mark as long_running if a test needs >= 5 min.",
    "long_running: Tests with a timeout >= 5 min.",
]

[tool.coverage.run]
source = ["heinzel", "heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "@overload", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.commitizen]
# Only `cz check` is used (commit-msg hook, `make commits`, CI); git-cliff and bump-my-version release.
# docs/CODING_STANDARDS.md#commits-branches-and-releases: these types and scopes, a summary of at most 72 characters
# (plus the " (#12)" a squash merge appends).
name = "cz_customize"
# Commitizen's defaults, plus the titles Dependabot writes (.github/dependabot.yml), which long package names can push
# past the length limit.
allowed_prefixes = ["Merge", "Revert", "Pull request", "fixup!", "squash!", "amend!", "build: bump ", "ci: bump "]

[tool.commitizen.customize]
schema = "<type>(<scope>)!: <summary of at most 72 characters>\n\n<body: why>\n\n<footers>"
schema_pattern = '(?s)(?=[^\n]{1,72}(?: \(#\d+\))?(?:\n|$))(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\((kernel|cli|heads|system|workflow|org|plugin|template|ci|docs|adr|agents|dx|security|release|deps|clock|github|atlassian|google|zoom)\))?!?: [^\s][^\n]*(\n\n.*|\s*)?$'
example = "fix(cli): exit with code 1 when an operation fails"
info = "Conventional commits with the types and scopes in docs/CODING_STANDARDS.md."

[tool.bumpversion]
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "name = \"heinzel\"\nversion = \"{current_version}\""
replace = "name = \"heinzel\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-clock/pyproject.toml"
search = "name = \"heinzel-clock\"\nversion = \"{current_version}\""
replace = "name = \"heinzel-clock\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]] # first-party plugins need the core they are released with
filename = "plugins/heinzel-clock/pyproject.toml"
search = "\"heinzel>={current_version}\""
replace = "\"heinzel>={new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "\"heinzel-clock>={current_version}\""
replace = "\"heinzel-clock>={new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-github/pyproject.toml"
search = "name = \"heinzel-github\"\nversion = \"{current_version}\""
replace = "name = \"heinzel-github\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-github/pyproject.toml"
search = "\"heinzel>={current_version}\""
replace = "\"heinzel>={new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "\"heinzel-github>={current_version}\""
replace = "\"heinzel-github>={new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-google/pyproject.toml"
search = "name = \"heinzel-google\"\nversion = \"{current_version}\""
replace = "name = \"heinzel-google\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-google/pyproject.toml"
search = "\"heinzel>={current_version}\""
replace = "\"heinzel>={new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "\"heinzel-google>={current_version}\""
replace = "\"heinzel-google>={new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-zoom/pyproject.toml"
search = "name = \"heinzel-zoom\"\nversion = \"{current_version}\""
replace = "name = \"heinzel-zoom\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-zoom/pyproject.toml"
search = "\"heinzel>={current_version}\""
replace = "\"heinzel>={new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "\"heinzel-zoom>={current_version}\""
replace = "\"heinzel-zoom>={new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-atlassian/pyproject.toml"
search = "name = \"heinzel-atlassian\"\nversion = \"{current_version}\""
replace = "name = \"heinzel-atlassian\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "plugins/heinzel-atlassian/pyproject.toml"
search = "\"heinzel>={current_version}\""
replace = "\"heinzel>={new_version}\""

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "\"heinzel-atlassian>={current_version}\""
replace = "\"heinzel-atlassian>={new_version}\""

[[tool.bumpversion.files]]
filename = "agent-skills/.claude-plugin/plugin.json"
search = "\"version\": \"{current_version}\""
replace = "\"version\": \"{new_version}\""

[[tool.bumpversion.files]]
filename = "copier.yml"
search = "default: \"{current_version}\" # bumped by the release process"
replace = "default: \"{new_version}\" # bumped by the release process"

[tool.git-cliff.remote.github]
owner = "helmut-hoffer-von-ankershoffen"
repo = "heinzel"

[tool.git-cliff.changelog]
header = "# Changelog\n\nAll notable changes to Heinzelmännchen, newest first. Versions follow [Semantic Versioning](https://semver.org); entries are generated by [git-cliff](https://git-cliff.org) from [conventional commits](https://www.conventionalcommits.org).\n"
body = """
{% macro remote_url() -%}https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}{%- endmacro -%}
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})){% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %} — **Breaking:** {{ commit.breaking_description | split(pat="\n\n") | first | trim | replace(from="\n", to=" ") }}{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.bump]
initial_tag = "v0.1.0"
# SemVer 0.x: breaking changes and features bump the minor version, everything else the patch. git-cliff defaults
# breaking changes to a major bump, which would jump to 1.0.0 on the next `!` commit.
breaking_always_bump_major = false
features_always_bump_minor = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
    # Drop what squash merges append after the body: the "🤖 Generated with" line, the "-----" separator, co-authors.
    { pattern = '(?m)^🤖 Generated with.*$\n?', replace = "" },
    { pattern = '(?m)^-+ *$\n?', replace = "" },
    { pattern = '(?mi)^Co-authored-by:.*$\n?', replace = "" },
    # Link pull request numbers that squash merges append: "(#12)".
    { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/helmut-hoffer-von-ankershoffen/heinzel/pull/${1}))" },
]
commit_parsers = [
    { message = "^chore\\(release\\)", skip = true },
    { field = "breaking", pattern = "true", group = "<!-- 00 -->💥 Breaking changes" },
    { message = "^[a-z]+\\(security\\)", group = "<!-- 01 -->🛡️ Security" },
    { body = "CVE-\\d{4}-\\d+|GHSA-[0-9a-z]{4}-", group = "<!-- 01 -->🛡️ Security" },
    { message = "^feat", group = "<!-- 02 -->✨ Features" },
    { message = "^fix", group = "<!-- 03 -->🐛 Bug fixes" },
    { message = "^perf", group = "<!-- 04 -->⚡ Performance" },
    { message = "^docs?", group = "<!-- 05 -->📚 Documentation" },
    { message = "^refactor", group = "<!-- 06 -->♻️ Refactoring" },
    { message = "^test", group = "<!-- 07 -->🧪 Testing" },
    { message = "^(build|ci)", group = "<!-- 08 -->🏗️ Build and CI" },
    { message = "^revert", group = "<!-- 09 -->⏪ Reverts" },
    { message = "^(chore|style)", group = "<!-- 10 -->🧹 Miscellaneous" },
]
protect_breaking_commits = true
tag_pattern = "v[0-9].*"

[tool.pyright]
include = ["src", "plugins/*/src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.typos.default.extend-words] # in pyproject.toml, so plugins get them with the shared files
CPY = "CPY" # ruff rule prefix (flake8-copyright)
Prompty = "Prompty" # a prompt file format, cited in docs/research/workflow-contracts.md
intoto = "intoto" # in-toto attestations, as in provenance.intoto.jsonl

[tool.importlinter]
root_packages = ["heinzel", "heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]
include_external_packages = true # so contracts can forbid a head's toolkit

[[tool.importlinter.contracts]]
name = "Modules never import a head's toolkit: they return results, heads present them"
type = "forbidden"
source_modules = ["heinzel.modules", "heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]
forbidden_modules = ["typer", "fastapi", "mcp", "uvicorn"]

[[tool.importlinter.contracts]]
name = "The kernel knows nothing about heads or modules"
type = "forbidden"
source_modules = ["heinzel.kernel"]
forbidden_modules = ["heinzel.heads", "heinzel.modules"]

[[tool.importlinter.contracts]]
name = "The kernel never imports keyring: the keychain backend belongs to system.credential (ADR 0030)"
type = "forbidden"
source_modules = ["heinzel.kernel"]
forbidden_modules = ["keyring"]

[[tool.importlinter.contracts]]
name = "The core imports no vendor client or agent SDK: adapters call CLIs; SDKs belong in plugins (ADR 0028, 0029)"
type = "forbidden"
source_modules = ["heinzel"]
forbidden_modules = ["anthropic", "claude_agent_sdk", "openai", "github", "atlassian", "jira", "googleapiclient", "slack_sdk", "zoomus"]

[[tool.importlinter.contracts]]
name = "Modules never import heads"
type = "forbidden"
source_modules = ["heinzel.modules"]
forbidden_modules = ["heinzel.heads"]

[[tool.importlinter.contracts]]
name = "Every module could be a plugin: system's submodules don't import each other"
type = "independence"
modules = [
    "heinzel.modules.system.agent",
    "heinzel.modules.system.capability",
    "heinzel.modules.system.changelog",
    "heinzel.modules.system.config",
    "heinzel.modules.system.credential",
    "heinzel.modules.system.daemon",
    "heinzel.modules.system.directory",
    "heinzel.modules.system.doctor",
    "heinzel.modules.system.plugin",
    "heinzel.modules.system.runner",
]

[[tool.importlinter.contracts]]
name = "Every module could be a plugin: top-level modules don't import each other, they inject services by type"
type = "independence"
modules = ["heinzel.modules.org", "heinzel.modules.system", "heinzel.modules.workflow"]

[[tool.importlinter.contracts]]
name = "Modules use only the kernel's public API, like plugins"
type = "forbidden"
source_modules = ["heinzel.modules"]
forbidden_modules = [
    "heinzel.kernel._agents", "heinzel.kernel._bindings", "heinzel.kernel._boot", "heinzel.kernel._capabilities", "heinzel.kernel._config", "heinzel.kernel._credentials", "heinzel.kernel._discovery", "heinzel.kernel._duration", "heinzel.kernel._errors", "heinzel.kernel._installation", "heinzel.kernel._jobs",
    "heinzel.kernel._kernel", "heinzel.kernel._lets", "heinzel.kernel._module", "heinzel.kernel._progress", "heinzel.kernel._release", "heinzel.kernel._settings",
    "heinzel.kernel._protocols", "heinzel.kernel._spec",
]
allow_indirect_imports = true # going through heinzel.kernel's public API is the point

[[tool.importlinter.contracts]]
name = "First-party plugins use only the public API, like any plugin"
type = "forbidden"
source_modules = ["heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]
forbidden_modules = ["heinzel.heads", "heinzel.modules", "heinzel.kernel._boot", "heinzel.kernel._kernel", "heinzel.kernel._module"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "First-party plugins are independent of each other, like separate repositories"
type = "independence"
modules = ["heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]

[[tool.importlinter.contracts]]
name = "The core imports no plugin: first-party plugins are installed on request, never by default (ADR 0017, 0028)"
type = "forbidden"
source_modules = ["heinzel"]
forbidden_modules = ["heinzel_atlassian", "heinzel_clock", "heinzel_github", "heinzel_google", "heinzel_zoom"]

[[tool.importlinter.contracts]]
name = "Heads only know what the kernel discovered"
type = "forbidden"
source_modules = ["heinzel.heads"]
forbidden_modules = ["heinzel.modules"]
