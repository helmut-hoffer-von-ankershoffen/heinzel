<footer class="hz-footer" aria-label="Site footer">
  <div class="hz-footer__inner">
    <div class="hz-footer__helper">
      <img src="{{ 'assets/website/head.svg' | url }}" alt="" width="44" height="39" loading="lazy">
      <p>Something off?<br><a href="{{ config.repo_url }}/issues">Open an issue</a></p>
    </div>
    <div class="hz-footer__install">
      <span id="hz-footer-label">Try it</span>
      <div class="hz-footer__command" role="group" aria-labelledby="hz-footer-label">
        <code id="hz-footer-command">uvx heinzel@latest</code>
        <button type="button" data-copy="hz-footer-command" aria-label="Copy command" title="Copy" hidden>
          <svg class="hz-copy__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
          <svg class="hz-copy__done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
          <span class="hz-visually-hidden" aria-live="polite"></span>
        </button>
      </div>
    </div>
    <nav class="hz-footer__links" aria-label="Footer">
      <a href="{{ 'guides/install/' | url }}">Start here</a>
      <a href="{{ 'CATALOG/' | url }}">Plugin catalog</a>
      <a href="{{ config.repo_url }}">GitHub</a>
      <a href="{{ config.repo_url }}/blob/main/CHANGELOG.md">Changelog</a>
      <a href="{{ config.repo_url }}/security">Security</a>
      <a href="{{ 'imprint/' | url }}">Imprint</a>
      <a href="{{ 'privacy/' | url }}">Privacy</a>
    </nav>
    <p class="hz-footer__legal"><a href="{{ config.repo_url }}/releases/latest" data-hz-version>Latest release</a> · MIT license</p>
  </div>
</footer>
