# The product and documentation site: the Markdown in docs/ as GitHub renders it, as a searchable site on GitHub Pages
# (ADR 0082). `make docs-site` builds it into site/; the Docs workflow deploys it. Nothing here is hand-written
# content: every page is a file in docs/ or at the root, so GitHub and the site show the same thing.
site_name: Heinzelmännchen
site_description: Open-source helpers that keep product development teams running.
site_url: https://heinzel.team/
repo_url: https://github.com/helmut-hoffer-von-ankershoffen/heinzel
repo_name: heinzel
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  overrides/
  _data/
  catalog-sources.toml
strict: false # root documents link to docs/ with ../; the site keeps them as GitHub links

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/website/head.svg
  favicon: assets/website/head.svg
  language: en
  icon:
    logo: material/account-group-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  generator: false

plugins:
  - search

extra_css:
  - assets/website/site.css
  - assets/website/trust.css
extra_javascript:
  - assets/website/site.js

hooks:
  - scripts/site_pages.py
  - scripts/mkdocs_hooks.py # links to files outside docs/ become GitHub links
  - scripts/adr_index.py # pull requests and amendments under each ADR title (core only)

nav:
  - Home: README.md
  - Start here:
      - Install Heinzel: guides/install.md
      - Your first session: guides/first-steps.md
      - Product tour: guides/tour.md
      - Bootstrap a team: guides/manager.md
      - Join a team: guides/joining.md
  - Plugin catalog: CATALOG.md
  - Build with Heinzel:
      - Contribution paths: guides/contribute.md
      - Create a public or private plugin: PLUGIN_AUTHORING.md
      - Screenshot playbook: SCREENSHOT_PLAYBOOK.md
      - Catalog metadata: guides/catalog.md
      - Extension contracts: PLUGINS.md
      - Themes and soundscapes: THEMES.md
      - Publishing: PUBLISHING.md
  - Vision & architecture:
      - Where we are going: VISION.md
      - Architecture tour: guides/architecture.md
      - Technical architecture: ARCHITECTURE.md
      - Decisions: adr/README.md
  - Reference:
      - Modules: MODULES.md
      - CLI: CLI_REFERENCE.md
      - Configuration: CONFIGURATION.md
      - Workflows: WORKFLOWS.md
      - Playbooks: PLAYBOOKS.md
      - Teams: TEAMS.md
      - Coding standards: CODING_STANDARDS.md
