# The documentation site: the Markdown in docs/ as GitHub renders it, as a searchable site on GitHub Pages
# (ADR 0082). `make docs-site` builds it into site/; the Docs workflow deploys it. Nothing here is hand-written
# content: every page is a file in docs/ or at the root, so GitHub and the site show the same thing.
site_name: Heinzelmännchen
site_description: Open-source helpers that keep product development teams running.
site_url: https://helmut-hoffer-von-ankershoffen.github.io/heinzel/
repo_url: https://github.com/helmut-hoffer-von-ankershoffen/heinzel
repo_name: heinzel
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
exclude_docs: |
  plugins/*/assets/*.md
strict: false # root documents link to docs/ with ../; the site keeps them as GitHub links

theme:
  name: material
  language: en
  icon:
    logo: material/account-group-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py # links to files outside docs/ become GitHub links

nav:
  - Overview: README.md
  - Get started:
      - Bootstrap your team: guides/manager.md
      - Join your team: guides/joining.md
  - Plugins:
      - Create a public or private plugin: PLUGIN_AUTHORING.md
      - Extension contracts: PLUGINS.md
      - Gallery: plugins/README.md
      - heinzel-atlassian: plugins/heinzel-atlassian/index.md
      - heinzel-clock: plugins/heinzel-clock/index.md
      - heinzel-github: plugins/heinzel-github/index.md
      - heinzel-google: plugins/heinzel-google/index.md
      - heinzel-zoom: plugins/heinzel-zoom/index.md
  - Reference:
      - Modules: MODULES.md
      - CLI: CLI_REFERENCE.md
      - Configuration: CONFIGURATION.md
      - Workflows: WORKFLOWS.md
      - Playbooks: PLAYBOOKS.md
      - Teams: TEAMS.md
  - Understand:
      - Architecture: ARCHITECTURE.md
      - Coding standards: CODING_STANDARDS.md
      - Decisions: adr/README.md
