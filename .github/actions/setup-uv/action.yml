name: Set up pinned uv
description: Install the tested uv release without a remote version manifest.
inputs:
  enable-cache:
    description: Forward the caller's cache policy.
    default: auto
  save-cache:
    description: Forward the caller's cache write policy.
    default: auto
  cache-dependency-glob:
    description: Files used to invalidate the uv cache.
    default: |
      **/*requirements*.txt
      **/*requirements*.in
      **/*constraints*.txt
      **/*constraints*.in
      **/pyproject.toml
      **/uv.lock
      **/*.py.lock
  python-version:
    description: Python version selected by the caller.
    default: ""
runs:
  using: composite
  steps:
    - name: Read the reviewed release manifest from this checkout
      id: manifest
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ "${RUNNER_OS:-}" = macOS ]; then
          test "$(uname -m)" = arm64 || { echo '::error::macOS CI requires Apple silicon (arm64)'; exit 1; }
        fi
        printf 'url=data:application/json;base64,%s\n' "$(base64 < "$ACTION_PATH/uv-manifest.json" | tr -d '\r\n')" >> "$GITHUB_OUTPUT"
    - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      with:
        version: "0.13.7"
        manifest-file: ${{ steps.manifest.outputs.url }}
        enable-cache: ${{ inputs.enable-cache }}
        save-cache: ${{ inputs.save-cache }}
        cache-dependency-glob: ${{ inputs.cache-dependency-glob }}
        python-version: ${{ inputs.python-version }}
    - name: Record Node filesystem identity without starting it
      shell: bash
      run: |
        # Do not execute, hash or read the executable: preserve first-start evidence.
        image=${ImageOS:-unknown}
        image_version=${ImageVersion:-unknown}
        printf 'node_identity phase=bootstrap runtime_version=unobserved image=%q image_version=%q\n' "${image:0:128}" "${image_version:0:128}"
        node_path=$(command -v node || true)
        printf 'node_identity lexical=%q\n' "${node_path:0:1024}"
        if [ -z "$node_path" ]; then
          echo 'node_identity state=missing'
          exit 0
        fi
        canonical=$node_path
        for ((link=0; link<16; link++)); do
          directory=$(cd -P -- "$(dirname -- "$canonical")" && pwd) || break
          canonical=$directory/$(basename -- "$canonical")
          [ -L "$canonical" ] || break
          target=$(readlink -- "$canonical") || break
          if [[ "$target" = /* ]]; then canonical=$target; else canonical=$directory/$target; fi
        done
        kind=other
        if [ -L "$canonical" ]; then kind=unresolved-symlink;
        elif [ -f "$canonical" ] && [ -x "$canonical" ]; then kind=regular-executable;
        elif [ -f "$canonical" ]; then kind=regular-nonexecutable; fi
        printf 'node_identity canonical=%q filesystem_type=%q\n' "${canonical:0:1024}" "$kind"
        # This separate header describes an installation, not a verified runtime version.
        header=$(dirname -- "$(dirname -- "$canonical")")/include/node/node_version.h
        if [ -f "$header" ]; then
          printf 'node_identity static_header=%q\n' "${header:0:1024}"
          if ! head -c 16384 "$header" | awk 'NR <= 512 && found < 3 && /^#define NODE_(MAJOR|MINOR|PATCH)_VERSION [0-9][0-9]?[0-9]?$/ {print; found++}'; then
            echo 'node_identity static_header=unreadable'
          fi
        else
          echo 'node_identity static_header=unavailable'
        fi
