version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let the ecosystem spot compromised releases first
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm # the web app (web/pnpm-lock.yaml); Dependabot updates pnpm lockfiles too
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      web:
        patterns: ["*"]
