version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # let the ecosystem spot compromised releases first
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
    groups:
      dependencies:
        patterns: ["*"]
  - package-ecosystem: npm # the web app (web/pnpm-lock.yaml); Dependabot updates pnpm lockfiles too
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
    ignore:
      # The Node the build runs on is pinned in uv.lock; @types/node must stay on its major (web_build_test).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `typescript` stays 5.x for the compiler API that web/e2e/mobile-responsive.mjs reads routes with; 7 ships
      # none. The type check already runs on 7 through @typescript/native.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      web:
        patterns: ["*"]
