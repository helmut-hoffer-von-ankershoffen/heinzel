name: Docs

# Product/docs site: offline builds for pull requests; fresh public metadata for publication (ADR 0098).
# Media recording is explicit and separate. Shared plugin repositories without a catalog retain ordinary MkDocs.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - scripts/site_*.py
      - scripts/mkdocs_hooks.*
      - scripts/adr_index.py
      - scripts/adr_index.py
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - scripts/site_*.py
      - scripts/mkdocs_hooks.*
      - scripts/adr_index.py
      - mkdocs.yml
      - .github/workflows/docs.yml
  schedule:
    - cron: '17 * * * *'
  workflow_call:
    inputs:
      site_only:
        description: Publish existing pages without re-recording, including when the caller was a push
        type: boolean
        default: false
      record:
        description: Re-record every scene and open a pull request with the changed media
        type: boolean
        default: false
    secrets:
      CONFIDENTIAL_TERMS:
        required: false
  workflow_dispatch:
    inputs:
      record:
        description: Re-record every scene and open a pull request with the changed media
        type: boolean
        default: false

permissions: {}

concurrency:
  group: docs-${{ github.repository }}-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  record:
    name: Record the scenes
    # Reusable workflows inherit the caller's event: a release push is explicitly site-only.
    if: inputs.site_only != true && inputs.record == true && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # push the docs/recordings branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # this job pushes a branch, and a poisoned cache must not be able to reach it (zizmor)
      - name: Fonts for the terminal recordings
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-jetbrains-mono fonts-noto-color-emoji
      - name: Chromium's system libraries, for Playwright
        run: uv run --quiet --group docs playwright install-deps chromium
      - name: Record every scene
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: make docs-record
      - name: Rebuild the pages, so they embed what was recorded
        run: make docs-plugins
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: docs/recordings
          title: "docs: re-record the plugin pages"
          commit-message: "docs: re-record the plugin pages"
          body: Re-recorded by the Docs workflow (`make docs-record`) from `docs/scenes.toml` and the derived scenes. Look at the last frames before merging.
          add-paths: |
            docs/plugins/**
            docs/assets/demo.*
          delete-branch: true

  site:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # the site is published, and a poisoned cache must not be able to reach it (zizmor)
      - name: Build and verify the product site or a standalone documentation site
        env:
          GH_TOKEN: ${{ github.token }}
          HZ_SITE_CATALOG: ${{ runner.temp }}/catalog.json
          REFRESH_PUBLIC: ${{ github.event_name != 'pull_request' }}
        run: make docs-publish-check
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-browser-evidence
          path: reports/site
          if-no-files-found: ignore
          retention-days: 1
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  pages:
    name: Deploy to GitHub Pages
    needs: site
    # Public repositories publish; a private one only when its owner says so, so no page of a company's plugin leaks.
    if: github.event_name != 'pull_request' && (github.event.repository.visibility == 'public' || vars.DOCS_PAGES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true # turns Pages on for the repository the first time, from the Actions source
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
