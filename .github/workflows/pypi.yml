name: Publish core to PyPI

# A maintainer authorizes an irreversible upload by dispatching this workflow on a genuine published release tag.
# No branch, ref, version, alternate registry or dry-run input can select what gets uploaded.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && startsWith(github.ref, 'refs/tags/v')
    name: Require passing acceptance once promotion is active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      # No checkout: this reads the run history only. Until promotion is active a maintainer's dispatch is the decision.
      - if: vars.RELEASE_CHANNELS == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          passed="$(gh run list --workflow acceptance.yml --limit 100 --json displayTitle,conclusion \
            --jq "[.[] | select(.conclusion == \"success\" and (.displayTitle | contains(\"/$TAG/\")))] | length")"
          test "$passed" -gt 0

  notifier:
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && startsWith(github.ref, 'refs/tags/v')
    name: Build the release notifier without publishing credentials
    needs: acceptance
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_HOST: github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tag before running build tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify the genuine published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          uv run --script scripts/pypi_release.py source "$TAG" release.json
          rm release.json
      - run: make notifier
      - name: Pack the notifier with its executable bits and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-notifier
          path: notifier.tar.gz
          if-no-files-found: error

  build:
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && startsWith(github.ref, 'refs/tags/v')
    name: Build and verify only the core distributions
    needs: notifier
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
      GH_HOST: github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the exact tag before running build tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify the genuine published release
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          uv run --script scripts/pypi_release.py source "$TAG" release.json >> "$GITHUB_OUTPUT"
          rm release.json
      - name: Check the release for confidential terms
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: uv run --script scripts/check_confidentiality.py --require
      - name: Check runtime license compatibility
        run: make licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-notifier
      - name: Restore the verified-tag notifier
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - name: Build the complete core wheel and source distribution
        run: uv build --package heinzel --out-dir dist
      - name: Remove uv's generated build helper
        run: make pypi-clean-build-marker
      - name: Verify artifact identity, payloads and digests
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: uv run --script scripts/pypi_release.py artifacts "$TAG" "$SOURCE_COMMIT" dist artifact-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-pypi-distributions
          path: |
            dist/*
            artifact-manifest.json
          if-no-files-found: error

  publish:
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && startsWith(github.ref, 'refs/tags/v')
    name: Upload verified core artifacts using PyPI trusted publishing
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pypi
      url: https://pypi.org/project/heinzel/
    permissions:
      id-token: write
    steps:
      # No checkout, dependency installation or build: this job is the only one with publishing authority.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-pypi-distributions
          path: release-artifacts
      - name: Recheck the immutable artifact manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path("release-artifacts")
          manifest = json.loads((root / "artifact-manifest.json").read_text())
          version = os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {f"heinzel-{version}-py3-none-any.whl", f"heinzel-{version}.tar.gz"}
          if (type(manifest.get("schema")) is not int or manifest["schema"] != 1
              or manifest.get("project") != "heinzel" or manifest.get("version") != version
              or manifest.get("commit") != os.environ["SOURCE_COMMIT"]
              or set(manifest.get("files", {})) != expected):
              raise SystemExit("Artifact identity differs from the authorized release")
          dist = root / "dist"
          if {p.name for p in dist.iterdir()} != expected:
              raise SystemExit("Unexpected or missing publishing artifacts")
          for name in sorted(expected):
              path = dist / name
              if path.is_symlink() or not path.is_file() or hashlib.sha256(path.read_bytes()).hexdigest() != manifest["files"][name]:
                  raise SystemExit("Artifact digest verification failed")
          PY
      - name: Publish the core with PyPI attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release-artifacts/dist
          attestations: true
          skip-existing: false
          verify-metadata: true
