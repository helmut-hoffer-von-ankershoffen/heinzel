# One focused test selection on one hosted runner, dispatched by hand (management tool `hz-ci-one dispatch`).
# A failure that only shows on a hosted runner gets checked in minutes instead of a full CI cycle. This is a
# diagnostic: it gates nothing, publishes nothing, and is no CI OK, acceptance or release evidence.
name: Focused job
run-name: "Focused ${{ inputs.kind }} on ${{ inputs.os }}: ${{ inputs.ref }}"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to test
        required: true
        type: string
      os:
        description: Hosted runner
        required: true
        type: choice
        options: [ubuntu-24.04, macos-latest]
      kind:
        description: What runs the selection
        required: true
        type: choice
        options: [e2e, pytest, vitest]
      selector:
        description: "e2e: a lane (cli, supervised, web-1, web-2) or test ids under tests/e2e/; pytest: ids under tests/; vitest: files under web/"
        required: true
        type: string
permissions: {}
# One focused run per ref at a time; a second dispatch for the same ref waits instead of competing for runners.
concurrency:
  group: focused-job-${{ inputs.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  focused:
    name: Focused ${{ inputs.kind }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_FROZEN: "1"
      FORCE_COLOR: "1"
      FOCUSED_REF: ${{ inputs.ref }}
      FOCUSED_KIND: ${{ inputs.kind }}
      FOCUSED_SELECTOR: ${{ inputs.selector }}
      FOCUSED_OUT: focused-artifacts
    steps:
      - name: Refuse a ref that is not a plain branch name or commit
        run: |
          [[ "$FOCUSED_REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ && "$FOCUSED_REF" != *..* ]] || { echo "::error::ref is not a branch or commit"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # the install-from-git end-to-end tests clone this repository
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # a dispatched diagnostic never writes the cache main and pull requests read
      - name: Validate the selection before installing anything
        run: uv run --quiet --script scripts/focused_job.py --check
      - name: Reuse the browsers this lockfile's Playwright installs
        if: inputs.kind == 'e2e' && inputs.selector != 'cli'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Use Ubuntu's primary archive for browser dependencies
        if: inputs.os == 'ubuntu-24.04' && inputs.kind == 'e2e' && inputs.selector != 'cli'
        run: sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browser runtimes and host dependencies
        if: inputs.kind == 'e2e' && inputs.selector != 'cli'
        run: make test-browser-deps
      - name: Run the selection
        run: uv run --quiet --script scripts/focused_job.py
        env:
          # read-only (contents: read), as in ci.yml's end-to-end job: the tests ask GitHub's API, which rate-limits
          # shared runners' unauthenticated requests; hz sends the token to api.github.com only (ADR 0031)
          GITHUB_TOKEN: ${{ github.token }}
      - name: Keep the report, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-${{ inputs.kind }}-${{ runner.os }}-${{ github.run_id }}
          path: focused-artifacts/
          if-no-files-found: ignore
          retention-days: 7
