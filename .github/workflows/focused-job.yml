# One focused test selection on one hosted runner, dispatched by hand (management tool `hz-ci-one dispatch`).
# A failure that only shows on a hosted runner gets checked in minutes instead of a full CI cycle. This is a
# diagnostic: it gates nothing, publishes nothing, and is no CI OK, acceptance or release evidence.
name: Focused job
run-name: "Focused ${{ inputs.kind }} on ${{ inputs.os }}: ${{ inputs.ref }}"
on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch this is dispatched on (`--ref`); the run tests that branch's head and nothing else
        required: true
        type: string
      os:
        description: Hosted runner
        required: true
        type: choice
        options: [ubuntu-24.04, macos-latest]
      kind:
        description: What runs the selection
        required: true
        type: choice
        options: [e2e, pytest, vitest]
      selector:
        description: "e2e: a lane (cli, supervised, web-1, web-2, web-3) or test ids under tests/e2e/; pytest: ids under tests/; vitest: files under web/"
        required: true
        type: string
      repeat:
        description: "Rounds of the selection in this one job, 1-60 (pytest/e2e ids repeat inside one pytest process)"
        required: false
        default: "1"
        type: string
      stress:
        description: Keep every CPU busy while the selection runs (timing flakes)
        required: false
        default: false
        type: boolean
permissions: {}
# One focused run per ref at a time; a second dispatch for the same ref waits instead of competing for runners.
concurrency:
  group: focused-job-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  focused:
    name: Focused ${{ inputs.kind }} (${{ inputs.os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_FROZEN: "1"
      FORCE_COLOR: "1"
      FOCUSED_REF: ${{ inputs.ref }}
      FOCUSED_KIND: ${{ inputs.kind }}
      FOCUSED_SELECTOR: ${{ inputs.selector }}
      FOCUSED_REPEAT: ${{ inputs.repeat }}
      FOCUSED_STRESS: ${{ inputs.stress }}
      FOCUSED_OUT: focused-artifacts
    steps:
      # The checkout is the dispatched branch itself (github.ref), never a ref taken from an input, so no other code can
      # reach this run or the cache scope of another branch; the input only states the intent and must match.
      - name: Refuse a ref other than the branch this was dispatched on
        run: |
          [[ "$FOCUSED_REF" == "$GITHUB_REF_NAME" ]] || { echo "::error::dispatch with --ref equal to the ref input"; exit 2; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the install-from-git end-to-end tests clone this repository
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # a dispatched diagnostic never writes the cache main and pull requests read
      - name: Validate the selection before installing anything
        run: uv run --no-build --quiet --script scripts/focused_job.py --check
      - name: Reuse the browsers this lockfile's Playwright installs
        if: inputs.kind == 'e2e' && inputs.selector != 'cli'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install browser runtimes and host dependencies
        if: inputs.kind == 'e2e' && inputs.selector != 'cli'
        run: make test-browser-deps
      # This exact pair opts into one synthetic native contract run. All other
      # focused selections retain their existing setup and behavior.
      - name: Build signed widget contract fixtures
        if: inputs.kind == 'pytest' && inputs.os == 'macos-latest' && inputs.selector == 'tests/integration/web_widget_apple_contract_test.py tests/integration/web_widget_webkit_contract_test.py'
        run: |
          set -euo pipefail
          [[ "$FOCUSED_REPEAT" == 1 && "$FOCUSED_STRESS" == false ]]
          fixture="$RUNNER_TEMP/widget-contract"
          mkdir -m 700 "$fixture" "$fixture/home" "$fixture/cache" "$fixture/tmp" "$fixture/bin" focused-artifacts
          export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
          git rev-parse HEAD HEAD^{tree} > focused-artifacts/widget-source.txt
          sw_vers > focused-artifacts/widget-macos.txt
          xcodebuild -version > focused-artifacts/widget-xcode.txt
          xcrun swiftc --version > focused-artifacts/widget-swift.txt
          node --version > focused-artifacts/widget-node.txt
          openssl version > focused-artifacts/widget-openssl.txt
          shasum -a 256 apple/Shared/{NativeRoute,ActivityCatalog,ActivityWidgetData,WidgetCredentialStore,WidgetFencedEnrollment,WidgetEnrollmentTransport}.swift apple/tests/{WidgetFencedProtocolHarness,WidgetWebKitEnrollmentTests}.swift tests/integration/web_widget_{apple,webkit}_contract_test.py > focused-artifacts/widget-source-sha256.txt
          xcrun swiftc -parse-as-library -swift-version 6 apple/Shared/{NativeRoute,ActivityCatalog,ActivityWidgetData,WidgetCredentialStore,WidgetFencedEnrollment}.swift apple/tests/WidgetFencedProtocolHarness.swift -o "$fixture/bin/fenced"
          xcrun swiftc -parse-as-library -swift-version 6 apple/Shared/{NativeRoute,ActivityCatalog,ActivityWidgetData,WidgetCredentialStore,WidgetFencedEnrollment,WidgetEnrollmentTransport}.swift apple/tests/WidgetWebKitEnrollmentTests.swift -o "$fixture/bin/webkit"
          codesign --force --sign - "$fixture/bin/fenced"
          codesign --force --sign - "$fixture/bin/webkit"
          codesign --verify --strict --verbose=2 "$fixture/bin/fenced"
          codesign --verify --strict --verbose=2 "$fixture/bin/webkit"
          shasum -a 256 "$fixture/bin/fenced" "$fixture/bin/webkit" > focused-artifacts/widget-binary-sha256.txt
          {
            echo "HOME=$fixture/home"
            echo "XDG_CACHE_HOME=$fixture/cache"
            echo "TMPDIR=$fixture/tmp"
            echo "HZ_QUEUE_STATE=$fixture/queue-state"
            echo "HZ_WIDGET_FENCED_HARNESS=$fixture/bin/fenced"
            echo "HZ_WIDGET_WEBKIT_HARNESS=$fixture/bin/webkit"
            echo "HZ_WIDGET_ENROLLMENT_SOURCE=$GITHUB_WORKSPACE/apple/Shared/WidgetEnrollmentTransport.swift"
          } >> "$GITHUB_ENV"
      - name: Run the selection
        run: uv run --no-build --quiet --script scripts/focused_job.py
        env:
          # read-only (contents: read), as in ci.yml's end-to-end job: the tests ask GitHub's API, which rate-limits
          # shared runners' unauthenticated requests; hz sends the token to api.github.com only (ADR 0031)
          GITHUB_TOKEN: ${{ github.token }}
      - name: Require all four widget contracts
        if: inputs.kind == 'pytest' && inputs.os == 'macos-latest' && inputs.selector == 'tests/integration/web_widget_apple_contract_test.py tests/integration/web_widget_webkit_contract_test.py'
        run: |
          python3 -c 'import sys, xml.etree.ElementTree as E; cases=E.parse("focused-artifacts/junit.xml").findall(".//testcase"); expected={"test_cancelled_issue_race_replans_and_replays_revoke", "test_native_fenced_retry_after_lost_core_reply", "test_native_script_and_core_recover_lost_reply", "test_real_webkit_cancelled_lost_issue_reply"}; actual=[c.get("name") for c in cases]; ok=len(cases)==4 and set(actual)==expected and all(not any(c.find(x) is not None for x in ("skipped", "failure", "error")) for c in cases); print("widget contracts:", actual, "PASS" if ok else "FAIL"); sys.exit(0 if ok else 1)'
      - name: Keep the report, tally, screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focused-${{ inputs.kind }}-${{ runner.os }}-${{ github.run_id }}
          path: focused-artifacts/
          if-no-files-found: ignore
          retention-days: 7
