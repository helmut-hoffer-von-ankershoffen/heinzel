# Isolated one-runner push-only diagnostic; not release or required CI evidence.
name: h17g mirror and browser diagnostic
run-name: h17g mirror diagnostic on exact 700d2d63
on:
  push:
    branches: [diag/h17g-ubuntu-mirror]
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/h17g-ubuntu-mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The exact committed push ref supplies only this diagnostic, never candidate code.
      - name: Checkout diagnostic ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin probe and preserve bootstrap
        run: make -f diagnostics/h17g/diagnostic.mk pin
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 700d2d634062b41c6336ad2774ec53a4b385b25b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source before setup
        run: make -f "$RUNNER_TEMP/h17g.mk" verify
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
      - name: Restore candidate-key browser cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Compare mirrors and run the candidate setup
        shell: bash
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: make -f "$RUNNER_TEMP/h17g.mk" probe
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h17g-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h17g/
          if-no-files-found: error
          retention-days: 7
