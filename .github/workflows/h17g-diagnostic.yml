# Isolated one-runner push-only diagnostic; not release or required CI evidence.
name: h17g mirror and browser diagnostic
run-name: h17g mirror diagnostic on exact 700d2d63
on:
  push:
    branches: [diag/h17g-ubuntu-mirror]
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/h17g-ubuntu-mirror'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Start source-bound evidence
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/h17g"
          printf 'RUN_ID=%s ATTEMPT=%s WORKFLOW_SHA=%s IMAGE_OS=%s IMAGE_VERSION=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_WORKFLOW_SHA" "${ImageOS:-unknown}" "${ImageVersion:-unknown}" > "$RUNNER_TEMP/h17g/bootstrap.log"
      # Diagnostic workflow/source runs only on its exact push ref.
      - name: Checkout diagnostic ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Pin and save reviewed probe
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '04a00c271ca3a3e5e5fe1853fe34b0448e8a161f2debb4f6e976832a0ea9f4d7' 'diagnostics/h17g/probe.sh' | sha256sum -c -
          cp diagnostics/h17g/probe.sh "$RUNNER_TEMP/h17g-probe.sh"
          sha256sum diagnostics/h17g/probe.sh .github/workflows/h17g-diagnostic.yml >> "$RUNNER_TEMP/h17g/bootstrap.log"
      - name: Checkout immutable candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 700d2d634062b41c6336ad2774ec53a4b385b25b
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate source before setup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 700d2d634062b41c6336ad2774ec53a4b385b25b
          printf 'CANDIDATE=%s\n' "$(git rev-parse HEAD)" >> "$RUNNER_TEMP/h17g/bootstrap.log"
          sha256sum .github/workflows/ci.yml scripts/web_build.py Makefile uv.lock web/pnpm-lock.yaml >> "$RUNNER_TEMP/h17g/bootstrap.log"
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
      - name: Restore candidate-key browser cache
        id: browser-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Compare mirrors and run the candidate setup
        shell: bash
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
        run: bash "$RUNNER_TEMP/h17g-probe.sh"
      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h17g-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h17g/
          if-no-files-found: error
          retention-days: 7
