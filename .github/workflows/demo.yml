name: Demo

# Re-records the README's demo GIF from docs/assets/demo.tape with VHS when the tape changes or on demand, and opens a
# pull request with the new GIF. Rendering isn't byte-identical between runs, so it doesn't run on every code change.
# The tape runs the real `hz` built from this checkout; only the install line is faked. Look at the GIF before merging.

on:
  push:
    branches: [main]
    paths:
      - docs/assets/demo.tape
  workflow_dispatch:

permissions: {}

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  demo:
    name: Regenerate the demo GIF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the docs/demo branch
      pull-requests: write # open the pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install hz from this checkout
        # jq, which the tape uses, is preinstalled on the runner. Editable, so `hz system plugin add clock` resolves the first-party plugin from this checkout too.
        run: |
          uv tool install --editable .
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: charmbracelet/vhs-action@f6d7db07a432fcd3b06772628d36a57f96d95dcf # v2.1.1
        with:
          path: docs/assets/demo.tape
          install-fonts: true
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: docs/demo
          title: "docs: regenerate the demo"
          commit-message: "docs: regenerate the demo"
          body: Re-recorded `docs/assets/demo.gif` from `docs/assets/demo.tape` by the Demo workflow.
          add-paths: docs/assets/demo.gif
          delete-branch: true
