name: Release freeze

# The check "Release freeze": red on a pull request while another one, the release candidate (release/vX.Y.Z), is
# open, so nothing merges to main between the candidate's base and its merge. The Release workflow posts the same check
# on every open PR when it opens the candidate and again after the merge (release_chain.py freeze-sync); a dispatch of
# this workflow does that by hand. A release PR merges only on the base its CI ran on, so a merge that slips in
# before the freeze stops the release instead of shipping unproven commits.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions: {}

jobs:
  freeze:
    name: Release freeze
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Pass unless another PR is the open release candidate
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run --no-project --frozen --no-build --python 3.15 python scripts/release_chain.py freeze-pr --pr "$PR"

  sync:
    name: Post the freeze on every open PR
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Post the check on every open PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project --frozen --no-build --python 3.15 python scripts/release_chain.py freeze-sync
