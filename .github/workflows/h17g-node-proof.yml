# Local proposal only; activation requires separate exact-head review and authorization.
name: h17g Node browser setup qualification
on:
  push:
    branches: [diag/h17g-node-proof]
permissions:
  contents: read
jobs:
  probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diag/h17g-node-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Initialize first-attempt evidence
        run: |
          make -f - init <<'MAKE'
          .RECIPEPREFIX := >
          init:
          >@mkdir -p "$${RUNNER_TEMP}/h17g-node-output"
          >@date +%s > "$${RUNNER_TEMP}/h17g-node-output/pin-epoch.txt"
          >@printf 'RUN=%s ATTEMPT=%s TRANSPORT=%s\n' "$${GITHUB_RUN_ID}" "$${GITHUB_RUN_ATTEMPT}" "$${GITHUB_SHA}" > "$${RUNNER_TEMP}/h17g-node-output/initial.log"
          >@test "$${GITHUB_RUN_ATTEMPT}" = 1
          MAKE
      - name: Checkout diagnostic transport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authenticate and preserve diagnostic closure
        run: make -f diagnostics/h17g-node/diagnostic.mk pin EXPECTED_DIAGNOSTIC_MK_SHA256=a49da9b7c2b38c71a578dc6f0df6b14b466ef7f31c8db57b65838afedc43c900
      - name: Checkout immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 700d2d634062b41c6336ad2774ec53a4b385b25b
          persist-credentials: false
      - name: Verify candidate and Node source inputs
        run: make -f "$RUNNER_TEMP/h17g-node.mk" verify
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
          save-cache: false
      - name: Run candidate Node setup and browser smokes
        run: make -f "$RUNNER_TEMP/h17g-node.mk" probe
      - name: Preserve runner-owned evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: h17g-node-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/h17g-node-output/
          if-no-files-found: error
          retention-days: 7
