name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *" # daily: new advisories and upstream changes break unchanged code too

permissions:
  contents: read

# Every commit on main gets its own group, so a later push never replaces a queued run or cancels a running one and
# each main commit ends with a CI result. Pull requests share one group per ref and cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

# GitHub-hosted macOS runners are the scarce resource, so a pull request runs macOS on the newest Python only, one
# `make setup` and the notifier app when its sources change. The broad platform matrix runs off pull requests.
# Provider-specific integration checks live with their owning plugins.
jobs:
  changes:
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      notifier: ${{ steps.paths.outputs.notifier }}
      contracts: ${{ steps.paths.outputs.contracts }}
      electron: ${{ steps.paths.outputs.electron }}
      core: ${{ steps.paths.outputs.core }}
      plugins: ${{ steps.paths.outputs.plugins }}
      site_only: ${{ steps.paths.outputs.site_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        name: Heinzel Notifier is built always, except on a pull request that leaves its sources alone
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          changed="$(git diff --name-only "$BASE...HEAD" || true)"
          # A push to main of prose alone: the pull request already ran everything on the same content. docs/ also
          # holds the install scripts, and release commits change CHANGELOG.md, so neither counts.
          prose_push=false
          if [ "$EVENT" = push ] && [ -n "$changed" ] && ! grep -qvE '^(docs/.*|.*\.md)$' <<< "$changed" \
            && ! grep -qE '(^|/)CHANGELOG\.md$|^docs/.*\.sh$' <<< "$changed"; then
            prose_push=true
          fi
          # A pull request of the site alone skips the app's test jobs and runs site-tests. The E2E suite runs the root
          # README's commands, and nested Markdown can be a template or a skill, so those do not count. These paths
          # are documents and tooling to the pre-push scope too; ci_test.py pins that.
          site_only=false
          if [ "$EVENT" = pull_request ] && [ -n "$changed" ] \
            && ! grep -qvE '^(docs/.*|[^/]*\.md|mkdocs\.yml|scripts/(site_[a-z_]+|check_docs)\.py|tests/unit/(site_[a-z_]+|docs_style|documentation)_test\.py)$' <<< "$changed" \
            && ! grep -qE '^(CHANGELOG|README)\.md$|^docs/.*\.sh$' <<< "$changed"; then
            site_only=true
          fi
          echo "site_only=$site_only" >> "$GITHUB_OUTPUT"
          if [ "$prose_push" = true ]; then
            echo "core=false" >> "$GITHUB_OUTPUT"
            core_work=false
          elif [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] \
            || [ -z "$changed" ] || grep -qvE '^plugins/' <<< "$changed"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            core_work=true
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            core_work=false
          fi
          if grep -qE '^plugins/' <<< "$changed"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$core_work" = true ] && { [ "$EVENT" != pull_request ] \
            || grep -qE '^(src/heinzel/modules/system/notify/macos/|scripts/notifier\.py$|scripts/tools\.toml$|Makefile$|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<< "$changed"; }; then
            echo "notifier=true" >> "$GITHUB_OUTPUT"
          else
            echo "notifier=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$core_work" = true ] && { [ "$EVENT" != pull_request ] \
            || grep -qE '^(src/heinzel/kernel/|src/heinzel/__init__\.py$|src/heinzel/heads/|src/heinzel/modules/system/ui/|web/src/plugins/)' <<< "$changed"; }; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi
          # A push to main needs Electron only for the paths a pull request needs it for; an unknown diff runs it.
          if [ "$core_work" = true ] && [ -f desktop/package.json ] && { [ "$EVENT" = schedule ] \
            || [ "$EVENT" = workflow_dispatch ] || [ -z "$changed" ] \
            || grep -qE '^(desktop/|Makefile$|scripts/sync_template\.py$|\.github/workflows/ci\.yml$)' <<< "$changed"; }; then
            echo "electron=true" >> "$GITHUB_OUTPUT"
          else
            echo "electron=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Commit messages, pull request title and branch (conventional, no confidential terms)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: make commits

  lint:
    name: Lint, contracts and types
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Require the confidential terms
        # Without the secret the confidentiality check would silently pass; pull requests from forks have no secrets.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: uv run --script scripts/check_confidentiality.py --require --text ""
      - run: make lint
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
      - run: make managed-backend-setup managed-backend-check # private Node process owner; core only
      - run: make typecheck
      - run: make test-web # the web app's component tests (Vitest with axe); core only

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Scan the history for credentials (gitleaks pinned in scripts/tools.toml, checksum verified)
        run: make secrets

  setup:
    name: make setup (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # What a contributor runs on a fresh machine, on each platform scripts/tools.toml pins: `make setup` installs
    # everything the build needs, relying only on git, make and uv, and `make doctor` confirms it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04","ubuntu-24.04-arm","macos-latest"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-latest","macos-15-intel"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make setup
      - run: make doctor
      - name: Every pinned tool, for every platform, still downloads and matches its checksum
        if: matrix.os == 'ubuntu-24.04'
        run: make tools-verify

  audit:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make audit

  test:
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.levels && format(', {0}', matrix.levels) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }} # a red cell is enough to know on a pull request
      matrix:
        os: [ubuntu-24.04]
        python: ["3.12", "3.13", "3.14", "3.15"]
        # macOS has 3 vCPU and runs the suite at the edge of the 420 s cap, so each cell is split into one shard per level
        # under that same cap. Newest Python on a pull request, oldest and newest on main and dispatches, all on schedule.
        include:
          ${{ fromJSON(github.event_name == 'pull_request' && '[{"os":"macos-latest","python":"3.15","levels":"unit"},{"os":"macos-latest","python":"3.15","levels":"integration"}]' || github.event_name == 'schedule' && '[{"os":"macos-latest","python":"3.12","levels":"unit"},{"os":"macos-latest","python":"3.12","levels":"integration"},{"os":"macos-latest","python":"3.13","levels":"unit"},{"os":"macos-latest","python":"3.13","levels":"integration"},{"os":"macos-latest","python":"3.14","levels":"unit"},{"os":"macos-latest","python":"3.14","levels":"integration"},{"os":"macos-latest","python":"3.15","levels":"unit"},{"os":"macos-latest","python":"3.15","levels":"integration"}]' || '[{"os":"macos-latest","python":"3.12","levels":"unit"},{"os":"macos-latest","python":"3.12","levels":"integration"},{"os":"macos-latest","python":"3.15","levels":"unit"},{"os":"macos-latest","python":"3.15","levels":"integration"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: ${{ matrix.python }}
      - name: Install what the tests need, and no more
        run: uv sync --no-dev --group test # UV_FROZEN: exactly the lockfile
      - name: Inspect the Linux user manager without starting services
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        env:
          UV_NO_SYNC: "1"
          PROBE_PREFIX: heinzel-probe-${{ github.run_id }}
        run: make linux-user-manager-proof
      - name: Unit and integration tests (unit first, 4 workers, stop at the first failure)
        env:
          UV_NO_SYNC: "1" # use the test group just installed
          TEST_LEVELS: ${{ matrix.levels || 'unit or integration' }}
          VERBOSE: "1" # a worker's INTERNALERROR trace comes first, above what the step wrapper's tail keeps
        run: make test-parallel

  coverage:
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Coverage
    # One measured run, in parallel with the matrix instead of after it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publishes the badge to the python-coverage-comment-action-data branch
      pull-requests: write # comments the coverage report on pull requests
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: "3.14"
      - run: uv sync --no-dev --group test # UV_FROZEN: exactly the lockfile
      - run: make test
      - name: Report coverage on pull requests and publish the badge
        # The action only understands pull_request, push and schedule events; dispatched runs (release PRs) skip it.
        if: github.event_name != 'workflow_dispatch'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  perf:
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Performance tests
    # Timing assertions (linear time) run here only: on a loaded developer machine they flake, so neither the
    # pre-push hook nor the test matrix runs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: "3.14"
      - run: uv sync --no-dev --group test # UV_FROZEN: exactly the lockfile
      - run: make test-perf

  site-tests:
    needs: changes
    if: needs.changes.outputs.site_only == 'true'
    name: Site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
          python-version: "3.14"
      - run: make test-site # the tests that read documents and the site

  e2e:
    name: End-to-end ${{ matrix.suite }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest"]') }}
        # Two jobs per OS so the browser tests and the tool-install and CLI tests stop competing for 3 vCPUs
        suite: [cli, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the install-from-git tests clone this repository
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Reuse the browsers this lockfile's Playwright installs
        if: matrix.suite == 'web'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Install browser runtimes and host dependencies
        if: matrix.suite == 'web'
        run: make test-browser-deps
      # Keep the full pytest traceback in CI logs when a browser interaction flakes; the step wrapper's default tail
      # can otherwise hide the test name and the action that timed out.
      - run: make test-e2e SUITE=${{ matrix.suite }}
        env:
          VERBOSE: "1"
          # read-only (contents: read): e2e tests ask GitHub's API (`hz system changelog --newer`), which rate-limits
          # shared runners' unauthenticated requests; hz sends the token to api.github.com only (ADR 0031)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  template:
    name: Plugin template
    needs: lint # the slowest offline check runs only once the cheap ones pass
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make template-test AUDIT=1

  notifier:
    name: Heinzel Notifier (macOS app)
    needs: changes
    if: needs.changes.outputs.notifier == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make notifier
      - name: Real launches leave no process behind (ADR 0043)
        run: make test-notifier
      - name: Pack the app, keeping its executable bit and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notifier
          path: notifier.tar.gz

  electron:
    name: Electron (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - name: Install the locked Electron package and native runtime
        run: make desktop-electron-test
      - name: Build and verify unsigned native package
        run: make desktop-electron-package
      - name: Configure Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: make desktop-electron-sandbox
      - name: Linux Electron native window smoke test
        if: runner.os == 'Linux'
        env:
          HZ_DISPOSABLE_NATIVE_CI: '1'
        run: make desktop-electron-native
      - name: macOS Electron native window smoke test
        if: runner.os == 'macOS'
        env:
          HZ_DISPOSABLE_NATIVE_CI: '1'
        run: make desktop-electron-native

  build:
    name: Build
    needs: [changes, notifier]
    if: ${{ !cancelled() && needs.changes.outputs.core == 'true' && needs.notifier.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - if: needs.notifier.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notifier
      - name: Unpack Heinzel Notifier into the package
        if: needs.notifier.result == 'success'
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - run: make build
      - name: Check the wheel ships the changelog
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'heinzel/CHANGELOG.md'
      - name: Check the wheel ships the attributions
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'licenses/ATTRIBUTIONS.md'
      - name: Check the wheel ships the web app
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'heinzel/heads/web/static/index.html'
      - name: Check the wheel ships Heinzel Notifier
        if: needs.notifier.result == 'success'
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'HeinzelNotifier.app/Contents/MacOS/notifier'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  core-wheel:
    name: Plugin SDK candidate
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build core artifacts for isolated consumer checks
        run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-core
          path: dist/heinzel-*.whl

  local-plugin-plan:
    name: Optional source plugins
    needs: changes
    if: needs.changes.outputs.plugins == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          path: .plugin-tooling
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONTRACT: ${{ needs.changes.outputs.contracts == 'true' && 'core:plugin-api@1' || '' }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          make --no-print-directory -C .plugin-tooling plan BASE="$BASE" CONTRACT="$CONTRACT" > plan.json
          echo "matrix=$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')" >> "$GITHUB_OUTPUT"
          echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"

  local-plugin-check:
    name: Source plugin (${{ matrix.name }})
    env:
      PLUGIN_PRIVATE: ${{ github.event.repository.private }}
    needs: [changes, core-wheel, local-plugin-plan]
    if: ${{ !cancelled() && needs.local-plugin-plan.outputs.selected == 'True' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.local-plugin-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          path: .plugin-tooling
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.core-wheel.result == 'success'
        with:
          name: plugin-core
          path: candidate
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: core
        env:
          CORE_URL: ${{ vars.CORE_ARTIFACT }}
          CORE_RUN: ${{ vars.CORE_CANDIDATE_RUN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G 'candidate/heinzel-*.whl' >/dev/null; then
            echo "wheel=$(realpath candidate/heinzel-*.whl)" >> "$GITHUB_OUTPUT"
          else
            uv run --no-project --script .plugin-tooling/scripts/core_artifact.py
          fi
      - name: Check, audit, build and accept only this plugin
        env:
          PLUGIN: ${{ matrix.name }}
          DIRECTORY: ${{ matrix.path }}
          CORE: ${{ steps.core.outputs.wheel }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          make --no-print-directory -C .plugin-tooling check NAME="$PLUGIN" CORE="$CORE"
          make --no-print-directory -C .plugin-tooling audit NAME="$PLUGIN" CORE="$CORE"
          make --no-print-directory -C .plugin-tooling build NAME="$PLUGIN"
          if [ -d "$DIRECTORY/tests/browser" ] || [ -d "$DIRECTORY/tests/acceptance" ] || [ -d "$DIRECTORY/tests/e2e" ]; then
            make --no-print-directory -C .plugin-tooling acceptance NAME="$PLUGIN" CORE="$CORE"
          fi

  consumer-plan:
    name: Public contract consumers
    needs: [changes, core-wheel]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-core
          path: candidate
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - id: plan
        run: |
          make plan CONTRACT=core:plugin-api@1 CORE="$(realpath candidate/*.whl)" > plan.json
          matrix="$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"

  consumer-check:
    name: Consumer (${{ matrix.name }})
    needs: consumer-plan
    if: needs.consumer-plan.outputs.selected == 'True'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-core
          path: candidate
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Test one consumer against the built public contract
        env:
          PLUGIN: ${{ matrix.name }}
        run: make check NAME="$PLUGIN" CORE="$(realpath candidate/*.whl)"

  ci-ok:
    name: CI OK
    if: always()
    needs: [dependency-review, commits, changes, lint, secrets, setup, audit, test, coverage, perf, site-tests, e2e, template, notifier, electron, build, core-wheel, local-plugin-plan, local-plugin-check, consumer-plan, consumer-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended with: $result"; exit 1 ;;
            esac
          done
