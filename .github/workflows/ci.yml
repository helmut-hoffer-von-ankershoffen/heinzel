name: CI
run-name: "${{ github.event_name == 'push' && 'CI batch admission ' || 'CI ' }}${{ github.sha }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *" # daily: new advisories and upstream changes break unchanged code too

permissions: {}

# Every commit on main gets its own group, so a later push never replaces a queued run or cancels a running one and
# each main commit ends with a CI result. Pull requests share one group per ref and cancel superseded runs, except a
# release PR (head release/*): its full-suite run is release evidence and is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}

env:
  UV_FROZEN: "1"
  FORCE_COLOR: "1"

# GitHub-hosted macOS runners are the scarce resource: a pull request waited longer for them than for anything else. So a
# pull request runs portable tests on Linux, Python oldest and newest, plus a real macOS smoke job. Native/platform
# and unknown changes also retain macOS setup, end-to-end and Electron checks. Every push to main, daily
# run and dispatch keeps the full setup, Python/shard, end-to-end, notifier, macOS-only and Electron matrix, and
# `CI OK` includes every scheduled job; macOS failures block after three clean full-suite main runs.
# Canonical owner-repository release PRs select that full workload in one run; token-created PRs retain full dispatch.
# Cheap checks cancel a failing same-repository pull request's run early; fork PRs finish with read-only tokens.
# Provider-specific integration checks live with their owning plugins.
jobs:
  admission:
    name: Main batch admission
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
      actions: read
      statuses: read
      pull-requests: read
    outputs:
      full: ${{ steps.batch.outputs.full }}
      base: ${{ steps.batch.outputs.base }}
      run: ${{ steps.batch.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - id: batch
        name: Admit the full run unless explicit batch proof covers this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-build --script scripts/main_batch.py

  batch-full:
    permissions:
      contents: read
    name: Main batch full suite (${{ needs.admission.outputs.base }})
    needs: admission
    if: needs.admission.outputs.full == 'true' && needs.admission.outputs.base != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - run: echo 'The validated aggregate base selects the full batch suite.'

  batch-delegated:
    permissions:
      contents: read
    name: Main batch delegated to ${{ needs.admission.outputs.run }}
    needs: admission
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.admission.outputs.full == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Record delegation without claiming CI OK for this intermediate commit
        env:
          FINAL_RUN: ${{ needs.admission.outputs.run }}
        run: echo "Full CI is recorded by final main run $FINAL_RUN" >> "$GITHUB_STEP_SUMMARY"

  changes:
    permissions:
      contents: read
    needs: admission
    if: github.event_name != 'push' || needs.admission.outputs.full != 'false'
    name: Changed paths
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      batch_base: ${{ needs.admission.outputs.base }}
      notifier: ${{ steps.paths.outputs.notifier }}
      contracts: ${{ steps.paths.outputs.contracts }}
      electron: ${{ steps.paths.outputs.electron }}
      core: ${{ steps.paths.outputs.core }}
      plugins: ${{ steps.paths.outputs.plugins }}
      site_only: ${{ steps.paths.outputs.site_only }}
      macos_full: ${{ steps.paths.outputs.macos_full }}
      full_release: ${{ steps.release.outputs.full_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - id: release
        name: Recognize the owner-repository canonical release candidate
        run: python3 -I scripts/release_candidate.py select --output "$GITHUB_OUTPUT"
      - id: paths
        name: Heinzel Notifier is built always, except on a pull request that leaves its sources alone
        env:
          EVENT: ${{ github.event_name }}
          FULL_RELEASE: ${{ steps.release.outputs.full_release }}
          BASE: ${{ needs.admission.outputs.base || github.event.pull_request.base.sha || github.event.before }}
          BATCH_BASE: ${{ needs.admission.outputs.base }}
        run: |
          changed="$(git diff --name-only "$BASE...HEAD")" || changed=""
          full_release="${FULL_RELEASE:-false}"
          # A push to main of prose alone: the pull request already ran everything on the same content. docs/ also
          # holds the install scripts, and release commits change CHANGELOG.md, so neither counts.
          prose_push=false
          if [ "$EVENT" = push ] && [ -n "$changed" ] && ! grep -qvE '^(docs/.*|.*\.md)$' <<< "$changed" \
            && ! grep -qE '(^|/)CHANGELOG\.md$|^docs/.*\.sh$' <<< "$changed"; then
            prose_push=true
          fi
          # A pull request of the site alone skips the app's test jobs and runs site-tests. The E2E suite runs the root
          # README's commands, and nested Markdown can be a template or a skill, so those do not count. These paths
          # are documents and tooling to the pre-push scope too; ci_test.py pins that.
          site_only=false
          if [ "$EVENT" = pull_request ] && [ "$full_release" != true ] && [ -n "$changed" ] \
            && ! grep -qvE '^(docs/.*|[^/]*\.md|mkdocs\.yml|scripts/(site_[a-z_]+|check_docs)\.py|tests/unit/(site_[a-z_]+|docs_style|documentation)_test\.py)$' <<< "$changed" \
            && ! grep -qE '^(CHANGELOG|README)\.md$|^docs/.*\.sh$' <<< "$changed"; then
            site_only=true
          fi
          echo "site_only=$site_only" >> "$GITHUB_OUTPUT"
          # PR portable tests run on Linux plus real macOS smoke. Native/platform changes retain macOS E2E and Electron;
          # only known portable UI, model and CI paths omit them; build/dependency inputs and unknown paths keep them.
          # Non-PR runs always retain the complete macOS matrix.
          macos_full=true
          if [ "$EVENT" = pull_request ] && [ "$full_release" != true ] && [ -n "$changed" ] \
            && ! grep -qvE '^(src/heinzel/(kernel/_(contributions|exposure)\.py$|modules/team/_(models|render)\.py$)|web/(src/|e2e/|openapi\.json$)|tests/(unit/|integration/|e2e/)|scripts/(main_batch|sync_template|ci_logs|scoped_checks|merge_gate|source_review|review_tier)\.py$|docs/|\.github/(workflows/ci\.yml$|[^/]*\.md$)|template/\.github/workflows/ci\.yml\.jinja$|[^/]*\.md$)' <<< "$changed" \
            && ! grep -qE '^(tests/(e2e/.*(install|daemon|update|ui_service)|.*(macos|notifier|supervision|tool_install|session_io|reveal|acceptance))|web/e2e/.*(install|daemon|update|native|electron|desktop|macos|notifier)|docs/.*\.sh$)' <<< "$changed"; then
            macos_full=false
          fi
          echo "macos_full=$macos_full" >> "$GITHUB_OUTPUT"
          if [ -n "${BATCH_BASE:-}" ]; then
            prose_push=false
          fi
          if [ "$prose_push" = true ]; then
            echo "core=false" >> "$GITHUB_OUTPUT"
            core_work=false
          elif [ "$full_release" = true ] || [ -n "${BATCH_BASE:-}" ] || [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] \
            || [ -z "$changed" ] || grep -qvE '^plugins/' <<< "$changed"; then
            echo "core=true" >> "$GITHUB_OUTPUT"
            core_work=true
          else
            echo "core=false" >> "$GITHUB_OUTPUT"
            core_work=false
          fi
          if grep -qE '^plugins/' <<< "$changed"; then
            echo "plugins=true" >> "$GITHUB_OUTPUT"
          else
            echo "plugins=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$core_work" = true ] && { [ "$full_release" = true ] || [ "$EVENT" != pull_request ] \
            || grep -qE '^(src/heinzel/modules/system/notify/macos/|scripts/notifier\.py$|scripts/tools\.toml$|Makefile$|pyproject\.toml$|\.github/workflows/ci\.yml$)' <<< "$changed"; }; then
            echo "notifier=true" >> "$GITHUB_OUTPUT"
          else
            echo "notifier=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$core_work" = true ] && { [ "$full_release" = true ] || [ "$EVENT" != pull_request ] \
            || grep -qE '^(src/heinzel/kernel/|src/heinzel/__init__\.py$|src/heinzel/heads/|src/heinzel/modules/system/ui/|web/src/plugins/)' <<< "$changed"; }; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi
          # A push to main needs Electron only for the paths a pull request needs it for; an unknown diff runs it.
          if [ "$core_work" = true ] && [ -f desktop/package.json ] && { [ "$full_release" = true ] || [ "$EVENT" = schedule ] \
            || [ "$EVENT" = workflow_dispatch ] || [ -z "$changed" ] \
            || { [ "$EVENT" = pull_request ] && [ "$macos_full" = true ] && [ "$site_only" = false ]; } \
            || grep -qE '^(desktop/|Makefile$|scripts/sync_template\.py$|\.github/workflows/ci\.yml$)' <<< "$changed"; }; then
            echo "electron=true" >> "$GITHUB_OUTPUT"
          else
            echo "electron=false" >> "$GITHUB_OUTPUT"
          fi

  dependency-review:
    permissions:
      contents: read
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  commits:
    permissions:
      contents: read
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Commit messages, pull request title and branch (conventional, no confidential terms)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: make commits

  lint:
    permissions:
      contents: read
    name: Lint, contracts and types
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Require the confidential terms
        # Without the secret the confidentiality check would silently pass; pull requests from forks have no secrets.
        if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: uv run --no-project --frozen --no-build --python 3.14 python scripts/check_confidentiality.py --require --text ""
      - run: make lint
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
      - run: make managed-backend-setup managed-backend-check # private Node process owner; core only
      - run: make typecheck
      - run: make test-web # the web app's component tests (Vitest with axe); core only

  secrets:
    permissions:
      contents: read
    needs: admission
    if: github.event_name != 'push' || needs.admission.outputs.full != 'false'
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # every commit, not just the tip
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Scan the history for credentials (gitleaks pinned in scripts/tools.toml, checksum verified)
        run: make secrets

  setup:
    permissions:
      contents: read
    name: make setup (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # What a contributor runs on Linux architectures and Apple-silicon macOS: `make setup` installs
    # everything the build needs, relying only on git, make and uv, and `make doctor` confirms it.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }} # stop waiting for other setup cells on a red PR
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.macos_full != 'true' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04","ubuntu-24.04-arm","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make setup
      - run: make doctor
      - name: Every pinned tool, for every platform, still downloads and matches its checksum
        if: matrix.os == 'ubuntu-24.04'
        run: make tools-verify

  audit:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.core == 'true'
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make audit

  test:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }}${{ matrix.levels && format(', {0}', matrix.levels) || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }} # a red cell is enough to know on a pull request
      matrix:
        os: [ubuntu-24.04]
        # Linux: oldest and newest Python on a pull request, every supported one on main, schedule and dispatch.
        python: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.full_release != 'true' && '["3.12","3.15"]' || '["3.12","3.13","3.14","3.15"]') }}
        # macOS has 3 vCPU and runs the suite at the edge of the 420 s cap, so each cell is split into one shard per level
        # under that same cap. PRs use Linux plus macOS smoke; non-PR runs retain every macOS Python/level cell.
        include:
          ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.full_release != 'true' && '[]' || github.event_name == 'schedule' && '[{"os":"macos-latest","python":"3.12","levels":"unit"},{"os":"macos-latest","python":"3.12","levels":"integration"},{"os":"macos-latest","python":"3.13","levels":"unit"},{"os":"macos-latest","python":"3.13","levels":"integration"},{"os":"macos-latest","python":"3.14","levels":"unit"},{"os":"macos-latest","python":"3.14","levels":"integration"},{"os":"macos-latest","python":"3.15","levels":"unit"},{"os":"macos-latest","python":"3.15","levels":"integration"}]' || '[{"os":"macos-latest","python":"3.12","levels":"unit"},{"os":"macos-latest","python":"3.12","levels":"integration"},{"os":"macos-latest","python":"3.13","levels":"unit"},{"os":"macos-latest","python":"3.13","levels":"integration"},{"os":"macos-latest","python":"3.14","levels":"unit"},{"os":"macos-latest","python":"3.14","levels":"integration"},{"os":"macos-latest","python":"3.15","levels":"unit"},{"os":"macos-latest","python":"3.15","levels":"integration"}]') }}
    env:
      # Unit-bearing cells need locked Node; integration-only dependency groups stay unchanged.
      CI_NODE_GROUP_ARGUMENT: ${{ matrix.levels != 'integration' && '--group=build' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: ${{ matrix.python }}
      - name: Install wheel dependencies
        if: matrix.python != '3.15'
        run: uv sync --frozen --no-build --no-dev --group test ${CI_NODE_GROUP_ARGUMENT:+"$CI_NODE_GROUP_ARGUMENT"}
      - name: Install Python 3.15 dependencies with the verified PyYAML compatibility build
        if: matrix.python == '3.15'
        run: |
          uv sync --frozen --no-build --no-dev --group test ${CI_NODE_GROUP_ARGUMENT:+"$CI_NODE_GROUP_ARGUMENT"} --no-install-package pyyaml
          bash scripts/bootstrap-pyyaml.sh
      - name: Select the locked wheel Node without executing it
        if: matrix.levels != 'integration'
        run: uv run --frozen --no-sync --no-build python scripts/ci_node.py
      - name: Inspect the Linux user manager without starting services
        if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.12' # a cell every pull request runs
        env:
          UV_NO_SYNC: "1"
          PROBE_PREFIX: heinzel-probe-${{ github.run_id }}
        run: make linux-user-manager-proof
      - name: Unit and integration tests (unit first, 4 workers, stop at the first failure)
        env:
          UV_NO_SYNC: "1" # use the test group just installed
          TEST_LEVELS: ${{ matrix.levels || 'unit or integration' }}
          VERBOSE: "1" # a worker's INTERNALERROR trace comes first, above what the step wrapper's tail keeps
        run: make test-parallel

  coverage:
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Coverage
    # One measured run, in parallel with the matrix instead of after it.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # publishes the badge to the python-coverage-comment-action-data branch
      pull-requests: write # comments the coverage report on pull requests
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: "3.14"
      - run: uv sync --frozen --no-build --no-dev --group test --group build
      - name: Select the locked wheel Node without executing it
        run: uv run --frozen --no-sync --no-build python scripts/ci_node.py
      - run: make test
      - name: Record the total for the merge gate
        run: uv run --no-build coverage report --format=total --precision=2 > coverage-total.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-total
          path: coverage-total.txt
          retention-days: 7
      - name: Report coverage on pull requests and publish the badge
        # The action only understands pull_request, push and schedule events; dispatched runs (release PRs) skip it.
        if: github.event_name != 'workflow_dispatch'
        uses: py-cov-action/python-coverage-comment-action@e5fb2218463c3377f3504b0c5b5646ed53da7a2f # v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 90
          MINIMUM_ORANGE: 80

  perf:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    name: Performance tests
    # Timing assertions (linear time) run here only: on a loaded developer machine they flake, so neither the
    # pre-push hook nor the test matrix runs them.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
          python-version: "3.14"
      - run: uv sync --frozen --no-build --no-dev --group test
      - run: make test-perf

  site-tests:
    permissions:
      contents: read
    needs: changes
    if: needs.changes.outputs.site_only == 'true'
    name: Site tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
          python-version: "3.14"
      - run: make test-site # the tests that read documents and the site

  e2e:
    name: End-to-end ${{ matrix.suite }} (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.macos_full != 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest"]') }}
        # Core E2E lanes: supervised cold starts, tool-install/CLI, and two browser halves; every lane blocks CI OK.
        suite: [cli, supervised, web-1, web-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the install-from-git tests clone this repository
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Reuse the browsers this lockfile's Playwright installs
        if: matrix.suite == 'supervised' || startsWith(matrix.suite, 'web')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - name: Use Ubuntu's primary archive for browser dependencies
        if: matrix.os == 'ubuntu-24.04' && (matrix.suite == 'supervised' || startsWith(matrix.suite, 'web'))
        run: sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browser runtimes and host dependencies
        if: matrix.suite == 'supervised' || startsWith(matrix.suite, 'web')
        run: make test-browser-deps
      # Keep the full pytest traceback in CI logs when a browser interaction flakes; the step wrapper's default tail
      # can otherwise hide the test name and the action that timed out.
      - run: make test-e2e SUITE=${{ matrix.suite }}
        env:
          VERBOSE: "1"
          # read-only (contents: read): e2e tests ask GitHub's API (`hz system changelog --newer`), which rate-limits
          # shared runners' unauthenticated requests; hz sends the token to api.github.com only (ADR 0031)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  template:
    permissions:
      contents: read
    name: Plugin template
    needs: lint # the slowest offline check runs only once the cheap ones pass
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - run: make template-test AUDIT=1

  notifier:
    permissions:
      contents: read
    name: Heinzel Notifier (macOS app)
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.full_release == 'true') && needs.changes.outputs.notifier == 'true' # ordinary pull requests: macos-smoke
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - run: make notifier
      - name: Real launches leave no process behind (ADR 0043)
        run: make test-notifier
      - name: Pack the app, keeping its executable bit and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notifier
          path: notifier.tar.gz

  macos-specific:
    permissions:
      contents: read
    name: macOS-specific tests
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.full_release == 'true') && needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: ${{ github.ref == 'refs/heads/main' }} # pull requests reuse main's cache
      - name: Install what the tests need, and no more
        run: uv sync --frozen --no-build --no-dev --group test # exactly the lockfile, no setup scripts
      - run: make notifier # the real-launch tests skip without the built app
      # Serial on purpose (no -n): the notifier tests share one machine-wide bundle id, and contention must not hit them.
      - name: Tests that only exercise macOS behaviour (marker macos_specific)
        env:
          UV_NO_SYNC: "1"
          VERBOSE: "1"
        run: make test-macos-specific

  macos-smoke:
    permissions:
      contents: read
    name: macOS smoke
    # Every app PR checks the CLI and macOS-only tests; full-macOS PRs also run the other platform jobs.
    # Build the notifier so the real-launch tests cannot silently skip.
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.full_release != 'true' && needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      UV_NO_SYNC: "1"
      VERBOSE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # pull requests reuse main's cache
      - name: Install what the tests need, and no more
        run: uv sync --frozen --no-build --no-dev --group test
      - name: Build Heinzel Notifier for the real-launch tests
        run: make notifier
      - name: The CLI starts, and the tests that only exercise macOS behaviour pass (serially)
        run: make test-macos-smoke
      - name: Pack Heinzel Notifier for the wheel
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notifier
          path: notifier.tar.gz

  electron:
    permissions:
      contents: read
    name: Electron (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && needs.changes.outputs.macos_full != 'true' && '["ubuntu-24.04"]' || '["ubuntu-24.04","macos-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Apple silicon for macOS CI
        if: runner.os == 'macOS'
        run: make ci-macos-arm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - name: Install the locked Electron package and native runtime
        run: make desktop-electron-test
      - name: Build and verify unsigned native package
        run: make desktop-electron-package
      - name: Configure Linux Electron sandbox helper
        if: runner.os == 'Linux'
        run: make desktop-electron-sandbox
      - name: Linux Electron native window smoke test
        if: runner.os == 'Linux'
        env:
          HZ_DISPOSABLE_NATIVE_CI: '1'
        run: make desktop-electron-native
      - name: macOS Electron native window smoke test
        if: runner.os == 'macOS'
        env:
          HZ_DISPOSABLE_NATIVE_CI: '1'
        run: make desktop-electron-native

  build:
    permissions:
      contents: read
    name: Build
    needs: [changes, notifier, macos-smoke]
    if: ${{ !cancelled() && needs.changes.outputs.core == 'true' && needs.notifier.result != 'failure' && needs.macos-smoke.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - if: needs.notifier.result == 'success' || needs.macos-smoke.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notifier
      - name: Unpack Heinzel Notifier into the package
        if: needs.notifier.result == 'success' || needs.macos-smoke.result == 'success'
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - run: make build
      - name: Check the wheel ships the changelog
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'heinzel/CHANGELOG.md'
      - name: Check the wheel ships the attributions
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'licenses/ATTRIBUTIONS.md'
      - name: Check the wheel ships the web app
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'heinzel/heads/web/static/index.html'
      - name: Check the wheel ships Heinzel Notifier
        if: needs.notifier.result == 'success' || needs.macos-smoke.result == 'success'
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'HeinzelNotifier.app/Contents/MacOS/notifier'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  core-wheel:
    permissions:
      contents: read
    name: Plugin SDK candidate
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - name: Build core artifacts for isolated consumer checks
        run: make build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-core
          path: dist/heinzel-*.whl

  local-plugin-plan:
    permissions:
      contents: read
    name: Optional source plugins
    needs: changes
    if: needs.changes.outputs.plugins == 'true' || needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          path: .plugin-tooling
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - id: plan
        env:
          BASE: ${{ needs.changes.outputs.batch_base || github.event.pull_request.base.sha || github.event.before }}
          CONTRACT: ${{ needs.changes.outputs.contracts == 'true' && 'core:plugin-api@1' || '' }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          make --no-print-directory -C .plugin-tooling plan BASE="$BASE" CONTRACT="$CONTRACT" > plan.json
          echo "matrix=$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')" >> "$GITHUB_OUTPUT"
          echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"

  local-plugin-check:
    name: Source plugin (${{ matrix.name }})
    env:
      PLUGIN_PRIVATE: ${{ github.event.repository.private }}
    needs: [changes, core-wheel, local-plugin-plan]
    if: ${{ !cancelled() && needs.local-plugin-plan.outputs.selected == 'True' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.local-plugin-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: ${{ vars.PLUGIN_COMPAT_REF || 'main' }}
          path: .plugin-tooling
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.core-wheel.result == 'success'
        with:
          name: plugin-core
          path: candidate
      - uses: ./.github/actions/setup-uv
      - id: core
        env:
          CORE_URL: ${{ vars.CORE_ARTIFACT }}
          CORE_RUN: ${{ vars.CORE_CANDIDATE_RUN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if compgen -G 'candidate/heinzel-*.whl' >/dev/null; then
            echo "wheel=$(realpath candidate/heinzel-*.whl)" >> "$GITHUB_OUTPUT"
          else
            uv run --no-project --frozen --no-build --python 3.14 python .plugin-tooling/scripts/core_artifact.py
          fi
      - name: Check, audit, build and accept only this plugin
        env:
          PLUGIN: ${{ matrix.name }}
          DIRECTORY: ${{ matrix.path }}
          CORE: ${{ steps.core.outputs.wheel }}
          PLUGIN_SOURCE_ROOT: ${{ github.workspace }}
        run: |
          make --no-print-directory -C .plugin-tooling check NAME="$PLUGIN" CORE="$CORE"
          make --no-print-directory -C .plugin-tooling audit NAME="$PLUGIN" CORE="$CORE"
          make --no-print-directory -C .plugin-tooling build NAME="$PLUGIN"
          if [ -d "$DIRECTORY/tests/browser" ] || [ -d "$DIRECTORY/tests/acceptance" ] || [ -d "$DIRECTORY/tests/e2e" ]; then
            make --no-print-directory -C .plugin-tooling acceptance NAME="$PLUGIN" CORE="$CORE"
          fi

  consumer-plan:
    permissions:
      contents: read
    name: Public contract consumers
    needs: [changes, core-wheel]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      selected: ${{ steps.plan.outputs.selected }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: 98ab970edad83ec4b778865907b4d35d44e89ca2 # candidate dependency locks; restore main after SDK publication
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-core
          path: candidate
      - name: Check out this exact core revision's bootstrap action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .core-bootstrap
          sparse-checkout: .github/actions/setup-uv
          persist-credentials: false
      - uses: ./.core-bootstrap/.github/actions/setup-uv
      - id: plan
        run: |
          make plan CONTRACT=core:plugin-api@1 CORE="$(realpath candidate/*.whl)" > plan.json
          matrix="$(python -c 'import json; print(json.dumps({"include":json.load(open("plan.json"))["include"]}))')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected=$(python -c 'import json; print(bool(json.load(open("plan.json"))["include"]))')" >> "$GITHUB_OUTPUT"
          cat plan.json >> "$GITHUB_STEP_SUMMARY"

  consumer-check:
    permissions:
      contents: read
    name: Consumer (${{ matrix.name }})
    needs: consumer-plan
    if: needs.consumer-plan.outputs.selected == 'True'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.consumer-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: helmut-hoffer-von-ankershoffen/heinzel-plugins
          ref: 98ab970edad83ec4b778865907b4d35d44e89ca2 # candidate dependency locks; restore main after SDK publication
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plugin-core
          path: candidate
      - name: Check out this exact core revision's bootstrap action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .core-bootstrap
          sparse-checkout: .github/actions/setup-uv
          persist-credentials: false
      - uses: ./.core-bootstrap/.github/actions/setup-uv
      - name: Test one consumer against the built public contract
        env:
          PLUGIN: ${{ matrix.name }}
        run: make check NAME="$PLUGIN" CORE="$(realpath candidate/*.whl)"

  stop-after-dependency-review:
    name: Stop after dependency-review failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [dependency-review]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  stop-after-commits:
    name: Stop after commits failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [commits]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  stop-after-lint:
    name: Stop after lint failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [lint]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  stop-after-secrets:
    name: Stop after secrets failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [secrets]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  stop-after-setup:
    name: Stop after setup failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [setup]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  stop-after-audit:
    name: Stop after audit failure
    # Each cheap check can cancel as soon as it fails; the expensive jobs start in parallel.
    needs: [audit]
    if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # cancels this run only
    steps:
      - name: Cancel the remaining jobs of this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "$RUN_ID" --repo "$REPOSITORY"

  release-candidate-source:
    name: Release candidate source
    needs: changes
    if: needs.changes.outputs.full_release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: Bind the actual tested tree to the exact release head
        run: python3 -I scripts/release_candidate.py record --output reports/release-candidate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-source
          path: reports/release-candidate.json
          if-no-files-found: error

  # The quarantine lane (scripts/quarantine.py): tests/quarantine.toml takes a known flake out of every required job
  # for at most 7 days. The registry check is required, so an entry past its `until` fails `CI OK`; the lane itself
  # runs where the full suite runs (main, schedule, dispatch, release candidates), reports and is NOT in `CI OK`.
  quarantine-registry:
    permissions:
      contents: read
    needs: admission
    if: github.event_name != 'push' || needs.admission.outputs.full != 'false'
    name: Quarantine registry
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - run: make quarantine-check

  quarantine-plan:
    permissions:
      contents: read
    name: Quarantine plan
    needs: changes
    if: (github.event_name != 'pull_request' || needs.changes.outputs.full_release == 'true') && needs.changes.outputs.core == 'true' && needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      selected: ${{ steps.plan.outputs.selected }}
      browsers: ${{ steps.plan.outputs.browsers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - id: plan
        run: make --no-print-directory quarantine-plan >> "$GITHUB_OUTPUT"

  quarantine:
    permissions:
      contents: read
    name: Quarantine (${{ matrix.os }})
    needs: [changes, quarantine-plan]
    # Non-blocking by design: not in `CI OK`, and `make test-quarantine` exits 0 whatever the tests do.
    if: (github.event_name != 'pull_request' || needs.changes.outputs.full_release == 'true') && needs.quarantine-plan.outputs.selected == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # an end-to-end entry may clone this repository
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false # the required jobs own the cache
      - name: Use Ubuntu's primary archive for browser dependencies
        if: matrix.os == 'ubuntu-24.04' && needs.quarantine-plan.outputs.browsers == 'true'
        run: sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
      - name: Install browser runtimes and host dependencies
        if: needs.quarantine-plan.outputs.browsers == 'true'
        run: make test-browser-deps
      - name: Run only the quarantined tests, retrying a failure up to 3 times, and report each result
        run: make test-quarantine
        env:
          VERBOSE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # read-only; as in the e2e job, for an end-to-end entry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quarantine-report-${{ matrix.os }}
          path: reports/quarantine.json
          retention-days: 14
          if-no-files-found: warn

  ci-ok:
    permissions:
      contents: read
    name: CI OK
    if: always() && (github.event_name != 'push' || needs.admission.outputs.full != 'false')
    needs: [admission, batch-full, dependency-review, commits, changes, lint, secrets, setup, audit, test, coverage, perf, site-tests, e2e, template, notifier, macos-specific, macos-smoke, electron, build, core-wheel, local-plugin-plan, local-plugin-check, consumer-plan, consumer-check, release-candidate-source, quarantine-registry]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail if any required job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "A required job ended with: $result"; exit 1 ;;
            esac
          done
