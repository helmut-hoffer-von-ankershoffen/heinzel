name: Release tag

# Step 2 of a release: when a release pull request ("chore(release): vX.Y.Z") is merged into main, tag the merge
# commit and publish. Tags pushed with the GitHub token don't trigger workflows, so Publish is called directly.

on:
  push:
    branches: [main]
  workflow_dispatch: # fallback if a merge made with the GitHub token doesn't trigger the push event
    inputs:
      sha:
        description: Exact protected main merge commit to tag
        type: string
        required: false

permissions: {}

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the release
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): v')"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read # verify the pre-merge chain receipt on a tag retry
      pull-requests: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
      - id: tag
        name: Create and push the tag
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ github.event.head_commit.message }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          tag="v$(uv version --short)"
          if [ -n "$REQUESTED_SHA" ]; then
            test "$GITHUB_REF" = refs/heads/main && test "$REQUESTED_SHA" = "$GITHUB_SHA" \
              || { echo 'error: Release tag dispatch does not bind the exact protected main merge' >&2; exit 1; }
          fi
          MESSAGE="${MESSAGE:-$(git log -1 --format=%B)}" # dispatched by hand: the commit checked out
          if [[ "$MESSAGE" != "chore(release): $tag"* ]]; then
            echo "Not a release of $tag; nothing to do."
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          policy="$(uv run --no-project --frozen --no-build --python 3.15 python scripts/release_latest.py "$tag" "$GITHUB_SHA")"
          if git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            if [ "$policy" = defer_latest=false ]; then
              echo "Already tagged $tag; nothing to do."
              exit 0
            fi
            test "$policy" = defer_latest=true
            git fetch --no-tags origin "refs/tags/$tag"
            test "$(git rev-parse --verify 'FETCH_HEAD^{commit}')" = "$GITHUB_SHA" \
              || { echo 'error: existing release tag does not point at the verified merge' >&2; exit 1; }
            if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx artifact-manifest.json; then
              echo "Already published $tag with its producer manifest; nothing to do."
              exit 0
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "$tag"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  publish:
    needs: tag
    if: needs.tag.outputs.tag != ''
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets:
      CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # Publish promotes the release candidate's macOS apps from its CI run
      pull-requests: read
