name: Edge release

# Every releasable green commit on main becomes an edge release (ADR 0114): a GitHub pre-release that is never latest
# and never reaches PyPI. Dark until the repository variable RELEASE_CHANNELS is `edge` or `stable`; until then, and on
# pull requests that change this pipeline, it only builds and verifies. The version is stamped in the build checkout;
# nothing is committed to main. A workflow_run checks out the default branch's tip, never the triggering ref, and runs
# only when that tip is the commit that just went green; a commit that main has passed is released with the next one.

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] the plan job admits only a green push to this repository's main
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: # publishes one edge release of main's tip, to prove the channel before it is activated
  pull_request:
    paths:
      - .github/workflows/edge.yml
      - scripts/release_channel*

permissions: {}

concurrency:
  group: edge-release-${{ github.event_name }}-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Decide whether this commit is an edge release
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha &&
      github.repository == 'helmut-hoffer-von-ankershoffen/heinzel')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # this decides a release, and a poisoned cache must not be able to reach it (zizmor)
      - id: plan
        name: Plan from the commit, the releases so far and the activation variable
        env:
          CHANNELS: ${{ vars.RELEASE_CHANNELS }}
          EVENT: ${{ github.event_name }}
        run: |
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          latest_edge="$(git tag --list 'edge-v*' --sort=-v:refname | head -n 1)"
          latest_stable="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-v:refname | head -n 1)"
          newest=""
          base="$latest_stable"
          if [ -n "$latest_edge" ]; then
            newest="${latest_edge#edge-v}"
            if git merge-base --is-ancestor "$latest_edge" HEAD; then
              base="$latest_edge"
            fi
          fi
          git diff --name-only "$base" HEAD > changed-paths.txt
          subject="$(git log -1 --format=%s)"
          releasable="$(uv run --no-build --frozen --script scripts/release_channel.py releasable < changed-paths.txt)"
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = workflow_dispatch ]; then
            releasable=true # a dry run or a deliberate proof of the pipeline, whatever changed
          elif [[ "$subject" == "chore(release): v"* ]]; then
            releasable=false # stable's own commit carries the version and changelog, and no new behaviour
          fi
          if [ "$releasable" != true ]; then
            echo "Nothing releasable since $base."
            exit 0
          fi
          current="$(uv version --short --frozen)"
          suggested="$(uv run --frozen git-cliff --offline --bumped-version)"
          version="$(uv run --no-build --frozen --script scripts/release_channel.py version \
            "$current" "${suggested#v}" "$(git rev-list --count HEAD)" ${newest:+"$newest"})"
          if [ -z "$version" ]; then
            echo "A newer edge release already exists."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = workflow_dispatch ] || { [ "$EVENT" = workflow_run ] && { [ "$CHANNELS" = edge ] || [ "$CHANNELS" = stable ]; }; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Edge $version from $commit; activation '${CHANNELS:-off}'."

  notifier:
    name: Build Heinzel Notifier without publishing credentials
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # this builds a release artifact (zizmor)
      - run: make notifier
      - name: Pack the notifier with its executable bits and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-notifier
          path: notifier.tar.gz
          if-no-files-found: error

  build:
    name: Build and verify ${{ needs.plan.outputs.version }}
    needs: [plan, notifier]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false # this builds a release artifact (zizmor)
      - name: Check the release for confidential terms
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: uv run --no-build --frozen --script scripts/check_confidentiality.py
      - name: Check runtime license compatibility
        run: make licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-notifier
      - name: Restore the notifier
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - name: Stamp the edge version in this checkout only
        run: uv run --no-build --frozen --script scripts/release_channel.py stamp "$VERSION"
      - name: Build the core wheel and source distribution
        run: uv build --package heinzel --out-dir dist
      - name: Remove uv's generated build helper
        run: make pypi-clean-build-marker
      - name: Verify the wheel is this edge version and ships the notifier
        run: |
          test -f "dist/heinzel-$VERSION-py3-none-any.whl"
          test -f "dist/heinzel-$VERSION.tar.gz"
          unzip -p "dist/heinzel-$VERSION-py3-none-any.whl" "heinzel-$VERSION.dist-info/METADATA" | grep -qx "Version: $VERSION"
          unzip -l "dist/heinzel-$VERSION-py3-none-any.whl" | grep -q 'HeinzelNotifier.app/Contents/MacOS/notifier'
      - name: Software bill of materials of the runtime dependencies
        run: uv export --quiet --frozen --no-dev --format cyclonedx1.5 --output-file "dist/heinzel-$VERSION.cdx.json"
      - name: Write the release notes and the channel pointer
        run: |
          uv run --no-build --frozen --script scripts/release_channel.py pointer "$VERSION" "$COMMIT" > edge.json
          {
            echo "Edge release of \`$COMMIT\`. Not the stable channel: see the install guide to opt in."
            echo
            uv run --frozen git-cliff --offline --unreleased --strip all
          } > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edge-release
          path: |
            dist/*
            edge.json
            release-notes.md
          if-no-files-found: error

  publish:
    name: Publish ${{ needs.plan.outputs.version }} as a GitHub pre-release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      COMMIT: ${{ needs.plan.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # No checkout or project code: this job is the only one that can write.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: edge-release
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the immutable pre-release, never latest
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" dist/provenance.sigstore.json
          jq -c .dsseEnvelope "$BUNDLE" > dist/provenance.intoto.jsonl
          gh release create "edge-v$VERSION" dist/* --target "$COMMIT" --title "edge $VERSION" \
            --notes-file release-notes.md --prerelease --latest=false
      - name: Move the channel pointer
        run: |
          gh release view edge-channel >/dev/null 2>&1 || gh release create edge-channel --target "$COMMIT" \
            --title "Edge channel pointer" --notes "Names the newest edge release." --prerelease --latest=false
          gh release upload edge-channel edge.json --clobber
