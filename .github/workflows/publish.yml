name: Publish

# Build a tagged version, attest its provenance and create the GitHub release with notes from git-cliff.
# Runs when a version tag is pushed, and is called by the Release workflow (whose pushes don't trigger workflows).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CONFIDENTIAL_TERMS:
        required: false
      # Core forwards these named environment secrets. Plugin callers omit them.
      HEINZEL_MAC_CERTIFICATE_B64:
        required: false
      HEINZEL_MAC_CERTIFICATE_PASSWORD:
        required: false
      HEINZEL_MAC_NOTARY_KEY_B64:
        required: false

permissions: {}

jobs:
  # Reuse the candidate's notifier and Electron archives by sha256 and tree. Candidate Swift bundles are
  # build evidence. Only the protected Developer ID job supplies the Swift archive for publication.
  promote:
    name: Promote the candidate's macOS apps for ${{ inputs.tag || github.ref_name }}
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    outputs:
      promoted: ${{ steps.promote.outputs.promoted }}
      reviewed: ${{ steps.signing-source.outputs.commit }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - id: signing-source
        name: Admit the protected release event and reviewed Core source
        env:
          GH_TOKEN: ${{ github.token }}
          HEINZEL_MAC_CANDIDATE_RUN: ${{ vars.HEINZEL_MAC_CANDIDATE_RUN }}
        run: make desktop-swift-admit-release
      - id: promote
        name: Find, verify and rebind the candidate's apps (falls back to building them)
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN: ${{ steps.signing-source.outputs.candidate_run }}
          APPROVED_CHECKOUT: ${{ steps.signing-source.outputs.candidate_checkout }}
          APPROVED_HEAD: ${{ steps.signing-source.outputs.candidate_head }}
        run: >-
          uv run --no-project --frozen --no-build --python 3.15 python -I scripts/release_apps.py
          promote "$TAG" "$RUNNER_TEMP/promoted" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.promote.outputs.promoted == 'true'
        with:
          name: promoted-notifier
          path: ${{ runner.temp }}/promoted/notifier/notifier.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.promote.outputs.promoted == 'true'
        with:
          name: promoted-desktop-macos-arm64
          path: ${{ runner.temp }}/promoted/desktop/
          if-no-files-found: error
          compression-level: 0

  # Heinzel Notifier, the core's macOS notifier app (ADR 0043), ships in the core's wheel only; plugins share this
  # workflow and skip it.
  notifier:
    name: Build Heinzel Notifier (macOS app) for ${{ inputs.tag || github.ref_name }}
    needs: promote
    if: ${{ !cancelled() && github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && needs.promote.outputs.promoted != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: ./.github/actions/setup-uv
      - run: make notifier
      - name: Pack the app, keeping its executable bit and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notifier
          path: notifier.tar.gz

  desktop:
    name: Build Heinzel desktop (macOS ARM64) for ${{ inputs.tag || github.ref_name }}
    needs: promote
    if: ${{ !cancelled() && github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' && needs.promote.outputs.promoted != 'true' }}
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - name: Require Apple silicon
        run: make ci-macos-arm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.15.0
          run_install: false
      - name: Build and verify the locked Electron bundle
        run: make desktop-electron-package
      - name: Archive the verified app and bind its release manifest
        run: node desktop/ci/release-macos.mjs "$TAG" "$GITHUB_SHA" desktop-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          path: desktop-release/
          if-no-files-found: error
          compression-level: 0

  swift-developer-id:
    name: Sign and notarize the managed Swift desktop archive
    needs: [promote, notifier, desktop]
    if: >-
      ${{ !cancelled() && github.repository == 'helmut-hoffer-von-ankershoffen/heinzel' &&
          needs.promote.result == 'success' && needs.promote.outputs.reviewed == github.sha &&
          (needs.promote.outputs.promoted == 'true' ||
           (needs.promote.outputs.promoted == 'false' &&
            needs.notifier.result == 'success' && needs.desktop.result == 'success')) }}
    environment: macos-developer-id
    runs-on: macos-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - name: Require Apple silicon
        run: make ci-macos-arm
      - name: Build, notarize and verify the extracted app and widget
        env:
          HEINZEL_MAC_SIGNING_TEAM: ${{ vars.HEINZEL_MAC_SIGNING_TEAM }}
          HEINZEL_MAC_CERTIFICATE_B64: ${{ secrets.HEINZEL_MAC_CERTIFICATE_B64 }}
          HEINZEL_MAC_CERTIFICATE_PASSWORD: ${{ secrets.HEINZEL_MAC_CERTIFICATE_PASSWORD }}
          HEINZEL_MAC_NOTARY_KEY_B64: ${{ secrets.HEINZEL_MAC_NOTARY_KEY_B64 }}
          HEINZEL_MAC_NOTARY_KEY_ID: ${{ vars.HEINZEL_MAC_NOTARY_KEY_ID }}
          HEINZEL_MAC_NOTARY_ISSUER: ${{ vars.HEINZEL_MAC_NOTARY_ISSUER }}
          HEINZEL_HTTPS_LINKS: 'NO'
          HEINZEL_ICLOUD_SIGN_IN: 'NO'
          HEINZEL_MAC_WIDGET_REFRESH: 'NO'
        run: make desktop-swift-sign-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-developer-id-macos-arm64
          path: |
            desktop-release/heinzel-desktop-swift-*-darwin-arm64.tar.gz
            desktop-release/desktop-swift-artifact-manifest.json
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    needs: [promote, notifier, desktop, swift-developer-id]
    if: >-
      ${{ !cancelled() &&
          (github.repository != 'helmut-hoffer-von-ankershoffen/heinzel' ||
           (needs.swift-developer-id.result == 'success' &&
            (needs.promote.outputs.promoted == 'true' ||
             (needs.notifier.result == 'success' && needs.desktop.result == 'success')))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read # bind the optional chain deferral to its first-attempt pre-merge receipt
      pull-requests: read
      statuses: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: ./.github/actions/setup-uv
      - name: Verify the reviewed core release source
        id: source
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: uv run --no-project --frozen --no-build --python 3.15 python scripts/pypi_release.py checkout "$TAG" >> "$GITHUB_OUTPUT"
      - name: Bind the optional release-chain acceptance requirement
        id: latest
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: uv run --no-project --frozen --no-build --python 3.15 python -I scripts/release_latest.py "$TAG" "$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the project version
        run: test "v$(uv version --short)" = "$TAG"
      - name: Check the Core foreground UI release contract
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        timeout-minutes: 1
        run: uv run --no-project --frozen --no-build --python 3.15 python -I scripts/acceptance/run_acceptance.py --check-foreground-ui "${TAG#v}"
      - name: Check the release for confidential terms
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: |
          if [ "$GITHUB_REPOSITORY" = helmut-hoffer-von-ankershoffen/heinzel ]; then
            uv run --no-project --frozen --no-build --python 3.15 python scripts/check_confidentiality.py --require
          else
            uv run --no-project --frozen --no-build --python 3.15 python scripts/check_confidentiality.py
          fi
      - name: Check that runtime dependencies keep the release MIT-compatible
        run: make licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.notifier.result == 'success' || needs.promote.outputs.promoted == 'true'
        with:
          name: ${{ needs.promote.outputs.promoted == 'true' && 'promoted-notifier' || 'notifier' }}
      - name: Unpack Heinzel Notifier into the package
        if: needs.notifier.result == 'success' || needs.promote.outputs.promoted == 'true'
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - run: make build # Heinzelmännchen builds the core and every first-party plugin, released together
      - name: Check the wheel ships Heinzel Notifier
        if: needs.notifier.result == 'success' || needs.promote.outputs.promoted == 'true'
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'HeinzelNotifier.app/Contents/MacOS/notifier'
      - name: Software bill of materials (CycloneDX) of the runtime dependencies
        #: workspace members, such as Heinzelmännchen's first-party plugins, are listed too.
        run: |
          name="$(uv version --color never | cut -d' ' -f1)"
          uv export --quiet --frozen --no-dev --format cyclonedx1.5 \
            --output-file "dist/${name}-${TAG#v}.cdx.json"
      - name: Verify and bind the exact core distributions before attestation
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          make pypi-clean-build-marker
          mkdir core-dist
          cp "dist/heinzel-${TAG#v}-py3-none-any.whl" "dist/heinzel-${TAG#v}.tar.gz" core-dist/
          uv run --no-project --frozen --no-build --python 3.15 python scripts/pypi_release.py producer "$TAG" "$SOURCE_COMMIT" core-dist dist/artifact-manifest.json
          rm -r core-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        with:
          name: ${{ needs.promote.outputs.promoted == 'true' && 'promoted-desktop-macos-arm64' || 'desktop-macos-arm64' }}
          path: desktop-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        with:
          name: swift-developer-id-macos-arm64
          path: signed-desktop
      - name: Bind the desktop assets before the official attestation
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: make desktop-bind-signed-release-assets
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write release notes
        run: uv run --no-project --frozen --no-build --python 3.15 python scripts/release_notes.py "$TAG" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          DEFER_LATEST: ${{ steps.latest.outputs.defer_latest }}
        run: |
          cp "$BUNDLE" "dist/provenance.sigstore.json"
          # The bundles' DSSE envelopes are the signed in-toto SLSA provenance on its own, the format OpenSSF
          # Scorecard (Signed-Releases) and SLSA verifiers look for as *.intoto.jsonl.
          jq -c .dsseEnvelope "$BUNDLE" > "dist/provenance.intoto.jsonl"
          latest=()
          if [ "$GITHUB_REPOSITORY" = helmut-hoffer-von-ankershoffen/heinzel ]; then
            case "$DEFER_LATEST" in
              true) latest=(--latest=false) ;;
              false) ;;
              *) echo 'error: Core release lacks a verified Latest policy' >&2; exit 1 ;;
            esac
          fi
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag "${latest[@]}"

      - name: Request the independent release docs refresh
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=core-release-published
