name: Publish

# Build a tagged version, attest its provenance and create the GitHub release with notes from git-cliff.
# Runs when a version tag is pushed, and is called by the Release workflow (whose pushes don't trigger workflows).

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CONFIDENTIAL_TERMS:
        required: false

permissions: {}

jobs:
  # Heinzel Notifier, the core's macOS notifier app (ADR 0043), ships in the core's wheel only; plugins share this
  # workflow and skip it.
  notifier:
    name: Build Heinzel Notifier (macOS app) for ${{ inputs.tag || github.ref_name }}
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: ./.github/actions/setup-uv
      - run: make notifier
      - name: Pack the app, keeping its executable bit and signature
        run: tar -czf notifier.tar.gz -C src/heinzel/modules/system/notify/macos HeinzelNotifier.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notifier
          path: notifier.tar.gz

  desktop:
    name: Build Heinzel desktop (macOS ARM64) for ${{ inputs.tag || github.ref_name }}
    if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - name: Require Apple silicon
        run: make ci-macos-arm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.15.0
          run_install: false
      - name: Build and verify the locked Electron bundle
        run: make desktop-electron-package
      - name: Archive the verified app and bind its release manifest
        run: node desktop/ci/release-macos.mjs "$TAG" "$GITHUB_SHA" desktop-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-arm64
          path: desktop-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Build and publish ${{ inputs.tag || github.ref_name }}
    needs: [notifier, desktop]
    if: >-
      ${{ !cancelled() &&
          (github.repository != 'helmut-hoffer-von-ankershoffen/heinzel' ||
           (needs.notifier.result == 'success' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the exact official core source before tooling
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          tagged="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged"
          test "$GITHUB_SHA" = "$tagged"
          git merge-base --is-ancestor "$tagged" origin/main
      - uses: ./.github/actions/setup-uv
      - name: Verify the reviewed core release source
        id: source
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        run: uv run --no-project --frozen --no-build --python 3.14 python scripts/pypi_release.py checkout "$TAG" >> "$GITHUB_OUTPUT"
      - name: Check that the tag matches the project version
        run: test "v$(uv version --short)" = "$TAG"
      - name: Check the Core foreground UI release contract
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        timeout-minutes: 1
        run: uv run --no-project --frozen --no-build --python 3.14 python -I scripts/acceptance/run_acceptance.py --check-foreground-ui "${TAG#v}"
      - name: Check the release for confidential terms
        env:
          CONFIDENTIAL_TERMS: ${{ secrets.CONFIDENTIAL_TERMS }}
        run: |
          if [ "$GITHUB_REPOSITORY" = helmut-hoffer-von-ankershoffen/heinzel ]; then
            uv run --no-project --frozen --no-build --python 3.14 python scripts/check_confidentiality.py --require
          else
            uv run --no-project --frozen --no-build --python 3.14 python scripts/check_confidentiality.py
          fi
      - name: Check that runtime dependencies keep the release MIT-compatible
        run: make licenses
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.notifier.result == 'success'
        with:
          name: notifier
      - name: Unpack Heinzel Notifier into the package
        if: needs.notifier.result == 'success'
        run: tar -xzf notifier.tar.gz -C src/heinzel/modules/system/notify/macos && rm notifier.tar.gz
      - run: make build # Heinzelmännchen builds the core and every first-party plugin, released together
      - name: Check the wheel ships Heinzel Notifier
        if: needs.notifier.result == 'success'
        run: unzip -l dist/heinzel-[0-9]*.whl | grep -q 'HeinzelNotifier.app/Contents/MacOS/notifier'
      - name: Software bill of materials (CycloneDX) of the runtime dependencies
        #: workspace members, such as Heinzelmännchen's first-party plugins, are listed too.
        run: |
          name="$(uv version --color never | cut -d' ' -f1)"
          uv export --quiet --frozen --no-dev --format cyclonedx1.5 \
            --output-file "dist/${name}-${TAG#v}.cdx.json"
      - name: Verify and bind the exact core distributions before attestation
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          make pypi-clean-build-marker
          mkdir core-dist
          cp "dist/heinzel-${TAG#v}-py3-none-any.whl" "dist/heinzel-${TAG#v}.tar.gz" core-dist/
          uv run --no-project --frozen --no-build --python 3.14 python scripts/pypi_release.py producer "$TAG" "$SOURCE_COMMIT" core-dist dist/artifact-manifest.json
          rm -r core-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        with:
          name: desktop-macos-arm64
          path: desktop-release
      - name: Bind the desktop assets before the official attestation
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          archive="heinzel-desktop-${TAG#v}-darwin-arm64.tar.gz"
          manifest="desktop-release/desktop-artifact-manifest.json"
          digest="$(sha256sum "desktop-release/$archive" | cut -d' ' -f1)"
          size="$(stat -c %s "desktop-release/$archive")"
          jq -e --arg version "${TAG#v}" --arg commit "$SOURCE_COMMIT" --arg archive "$archive" \
            --arg digest "$digest" --argjson size "$size" \
            '. == {schema: 1, version: $version, commit: $commit, platform: "darwin", arch: "arm64",
                    archive: {name: $archive, sha256: $digest, size: $size}}' "$manifest"
          mv -- "$manifest" "desktop-release/$archive" dist/
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Write release notes
        run: uv run --no-project --frozen --no-build --python 3.14 python scripts/release_notes.py "$TAG" > release-notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "dist/provenance.sigstore.json"
          # The bundles' DSSE envelopes are the signed in-toto SLSA provenance on its own, the format OpenSSF
          # Scorecard (Signed-Releases) and SLSA verifiers look for as *.intoto.jsonl.
          jq -c .dsseEnvelope "$BUNDLE" > "dist/provenance.intoto.jsonl"
          gh release create "$TAG" dist/* --title "$TAG" --notes-file release-notes.md --verify-tag

      - name: Request the independent release docs refresh
        if: github.repository == 'helmut-hoffer-von-ankershoffen/heinzel'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=core-release-published
