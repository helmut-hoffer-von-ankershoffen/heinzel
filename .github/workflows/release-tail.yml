name: Release tail
run-name: "Release tail v${{ inputs.version }}"

# The tail of one Core release, after its tag and GitHub release exist (started by "Release", release-chain.yml, and
# by any later dispatch of it that finds the tail stopped): Core on PyPI, compose, the sharded acceptance.yml on both OSes
# by workflow_call, then the verdict, the acceptance.json marker and Latest (scripts/release_chain.py).
#
# Pipelining: each version has its own concurrency group, apart from the chain's group, so while this tail runs main
# is open and the next release can be cut and run its candidate CI. At most two releases are in flight (the plan
# refuses a third). A newer tail waits only at its verdict until every older release is terminal: ACCEPTED, or not
# accepted and so absorbed by the newer one. A rerun of failed jobs never counts as acceptance: dispatch again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version X.Y.Z whose tag and GitHub release exist"
        type: string
        required: true

permissions: {}

concurrency:
  group: release-tail-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Core and compose v${{ inputs.version }}
    # The protected queue integration must land before hosted release writes are enabled.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write
    outputs:
      wheel: ${{ steps.snapshot.outputs.wheel_sha256 }}
      profile: ${{ steps.snapshot.outputs.profile_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - name: A tail runs only from main, on a published release
        env:
          REF: ${{ github.ref }}
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "error: $VERSION is no X.Y.Z" >&2; exit 1; }
          test "$REF" = refs/heads/main || { echo "error: the tail runs only from main (this run is on $REF)" >&2; exit 1; }
          gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx artifact-manifest.json \
            || { echo "error: v$VERSION has no published release with its producer manifest" >&2; exit 1; }
      - name: Publish the exact GitHub release bytes to PyPI
        run: |
          if curl -fsS -o /dev/null "https://pypi.org/pypi/heinzel/$VERSION/json"; then echo "ok   PyPI has $VERSION"; exit 0; fi
          before="$(gh run list -R "$GITHUB_REPOSITORY" -w pypi.yml -b "v$VERSION" -L 1 --json databaseId --jq '.[0].databaseId // 0')"
          gh workflow run pypi.yml -R "$GITHUB_REPOSITORY" --ref "v$VERSION"
          run=""
          for _ in $(seq 1 18); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" -w pypi.yml -b "v$VERSION" -L 1 --json databaseId --jq '.[0].databaseId // 0')"
            if [ "$id" -gt "$before" ]; then run="$id"; break; fi
            sleep 10
          done
          test -n "$run" || { echo "error: the PyPI dispatch created no new run" >&2; exit 1; }
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 30 > /dev/null
      - id: core-published
        name: Verify PyPI serves the tag's exact Core wheel before composition
        run: |
          uv run --no-project --frozen --no-build --python 3.15 python scripts/release_chain.py core-published \
            --version "$VERSION" --wait 300
      - name: Compose the standard app from the verified Core wheel
        env:
          CORE_WHEEL: ${{ steps.core-published.outputs.wheel_url }}
          RELEASE_TOKEN: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && secrets.RELEASE_TOKEN || '' }}
        run: |
          if gh release view "app-v$VERSION" -R helmut-hoffer-von-ankershoffen/heinzel-plugins > /dev/null 2>&1; then exit 0; fi
          curl -fsSIL --max-time 30 --retry 29 --retry-delay 10 --retry-max-time 300 --retry-all-errors -o /dev/null "$CORE_WHEEL" \
            || { echo "error: the wheel asset of v$VERSION does not answer; compose not dispatched" >&2; exit 1; }
          # Without the dispatch grant the plugins' schedule composes from PyPI.
          GH_TOKEN="$RELEASE_TOKEN" gh workflow run compose.yml -R helmut-hoffer-von-ankershoffen/heinzel-plugins --ref main \
            -f version="$VERSION" -f core_wheel="$CORE_WHEEL" \
            || echo "note: compose not dispatched; the plugins schedule composes v$VERSION"
      - id: snapshot
        name: Bind the bytes acceptance proves (GitHub wheel equal to PyPI, composed profile)
        run: |
          uv run --no-project --frozen --no-build --python 3.15 python scripts/release_chain.py snapshot \
            --version "$VERSION" --wait 3600

  acceptance:
    name: Published-build acceptance
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/acceptance.yml
    with:
      expected_version: ${{ inputs.version }}
      expected_app_version: ${{ inputs.version }}
      expected_wheel_sha256: ${{ needs.publish.outputs.wheel }}
      expected_profile_sha256: ${{ needs.publish.outputs.profile }}
      release_attempt: release-tail-${{ github.run_id }}

  verdict:
    name: Verdict, marker, Latest
    needs: [publish, acceptance]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.acceptance.result != 'skipped' }}
    runs-on: ubuntu-24.04
    # Judged at once; the marker and Latest wait (up to 230 min) until every older release in its tail is terminal.
    timeout-minutes: 240
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: acceptance-result-*
          path: receipts
      - name: Judge both receipts, write the marker, then mark the release Latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          WHEEL: ${{ needs.publish.outputs.wheel }}
          PROFILE: ${{ needs.publish.outputs.profile }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          uv run --no-project --frozen --no-build --python 3.15 python scripts/release_chain.py verdict \
            --version "$VERSION" --receipts receipts --run-id "$RUN_ID" --attempt "$ATTEMPT" \
            --wheel-sha256 "$WHEEL" --profile-sha256 "$PROFILE" --wait 13800
