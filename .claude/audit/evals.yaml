# Cases the consistency auditor must catch, for skill `self-audit` step 7. Each `commit` is the tree before the fix;
# a hit is a finding of the expected class whose evidence names one of the expected locations.
# The ledger and these cases are public: no quotes, no names, and retired names are described, never spelled out.
cases:
  - id: ci-bypasses-make
    commit: 458efea  # fixed by 39325ce "ci: run every check through the same make targets as locally"
    class: I1
    locations: [.github/workflows/ci.yml, Makefile]
    about: CI ran lint, type and test tools directly instead of the make targets developers run.
  - id: build-only-core
    commit: 458efea  # fixed by 39325ce
    class: I1
    locations: [Makefile, .github/workflows/ci.yml]
    about: make build built only the core while CI and ADR 0017 build every workspace package.
  - id: adr-0017-proposed
    commit: 1eb3056  # fixed by e5585e9 "docs(adr): adopt a MADR-based template, retrofit ADRs ..."
    class: I3
    locations: [docs/adr/0017-first-party-plugins-in-the-core-repository.md, packages/]
    about: ADR 0017 was still proposed although first-party plugins already lived in packages/.
  - id: retired-hook-name
    commit: d8be182  # fixed by cf388fe "fix(kernel): rename the pluggy hook ..."
    class: I4
    locations: [src/heinzel/kernel/_spec.py, src/heinzel/kernel/_module.py, src/heinzel/kernel/_kernel.py]
    about: The pluggy hook still carried the project's working title after the rename to Heinzelmännchen.
  - id: timeouts-without-guard
    commit: 1eb3056  # fixed by 3c5500b "feat(dx): codify standards as checks; enforce subprocess timeouts"
    class: I5
    locations: [SECURITY.md, src/heinzel/modules/system/plugin/_service.py]
    about: SECURITY.md claimed every external command has a timeout; no test enforced it and one call had none.
  - id: strict-without-updater
    commit: e5585e9  # fixed by 458efea "ci: keep auto-merging pull requests up to date with main"
    class: I6
    locations: [.github/workflows/, scripts/pr.sh]
    about: main required branches to be up to date, but nothing updated auto-merging pull requests that fell behind.
