file = "tests/fixtures/auto_update/fake_release.py"
old = """    from heinzel.modules.system import _plugin_releases, _service, _update
    from heinzel.modules.system._models import AnnouncedUpdate
"""
new = """    from heinzel.modules.system import _service
    from heinzel.modules.system._models import AnnouncedUpdate
    from heinzel.modules.system.updater import _plugin_releases, _update
"""

