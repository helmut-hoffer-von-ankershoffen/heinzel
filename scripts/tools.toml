# Programs the build runs that are not Python packages. Python tools are dependency groups in pyproject.toml, locked
# in uv.lock; everything here is a binary pinned to a version and, per platform, a download and its sha256.
# scripts/tools.py installs them into .tools/bin (gitignored), which make puts first on PATH:
#   group "build": `make install` (and `make setup`) installs them; the git hooks and CI use the same copies.
#   group "web":   `make install` installs them where there is a web/ app (the core; plugins have none).
#   group "demo":  `make demo` and `make docs-record` install them when they need them.
# A platform without a pinned file uses the program on PATH, and `hint` says how to install it there.
# Platforms: darwin-arm64, darwin-x86_64, linux-x86_64, linux-arm64. `url` may use {version} and {file}; a file
# entry may override it. `member` is the binary's path inside an archive (.tar.gz, .zip, .whl), glob patterns allowed;
# without it the download is the binary. Decided in docs/adr/0036-the-build-installs-its-own-tools.md.
# To bump a tool: change its version (and file names), then `uv run --script scripts/tools.py pin NAME` writes the
# new checksums.

[gitleaks]
version = "8.30.1"
group = "build"
why = "credential scan: the pre-commit hook, and `make secrets` over the whole history in CI"
home = "https://github.com/gitleaks/gitleaks"
url = "https://github.com/gitleaks/gitleaks/releases/download/v{version}/{file}"
member = "gitleaks"
hint = { darwin = "brew install gitleaks", linux = "see https://github.com/gitleaks/gitleaks#installing" }

[gitleaks.files]
darwin-arm64 = { file = "gitleaks_{version}_darwin_arm64.tar.gz", sha256 = "b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5" }
darwin-x86_64 = { file = "gitleaks_{version}_darwin_x64.tar.gz", sha256 = "dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709" }
