# Acme's look, a made-up company's theme for tests (ADR 0044).
name = "acme"
title = "Acme"
font_sans = "Avenir Next, system-ui, sans-serif"
font_mono = 'ui-monospace, "SF Mono", monospace'
radius = "0.75rem"
border_width = "1px"

[light]
background = "#fdfcf9"
foreground = "#221811"
muted = "#f3f0ea"
muted_foreground = "#61564d"
card = "#ffffff"
border = "#e1ddd7"
primary = "#0f766e"
primary_foreground = "#fdfcf9"
accent = "#f9e8d6"
ok = "#137738"
warn = "#9d6400"
bad = "#be222a"
ring = "#0f766e"
sidebar = "#f3f0ea"
input = "#e1ddd7"
popover = "#ffffff"

[dark]
background = "#16100c"
foreground = "#ebe7e1"
muted = "#241e1a"
muted_foreground = "#aba39b"
card = "#1d1713"
border = "#38322d"
primary = "#2dd4bf"
primary_foreground = "#16100c"
accent = "#37281c"
ok = "#62c37a"
warn = "#e9b452"
bad = "#f97770"
ring = "#2dd4bf"
sidebar = "#241e1a"
input = "#38322d"
popover = "#1d1713"
