[project]
name = "heinzel-openmeteo"
version = "0.4.0"
description = "Weather from Open-Meteo, with no account and no key: the weather capability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.4.0"] # released together; the release process bumps the bound

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-openmeteo"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
openmeteo = "heinzel_openmeteo"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
