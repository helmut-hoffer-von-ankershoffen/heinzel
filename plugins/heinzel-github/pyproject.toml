[project]
name = "heinzel-github"
version = "0.2.0"
description = "Read pull requests and issues from GitHub: the code-host and tracker capabilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.2.0"] # released together; the release process bumps the bound

[project.entry-points."heinzel.modules"]
github = "heinzel_github"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
