[project]
name = "heinzel-github"
version = "0.7.22"
description = "Read pull requests and issues from GitHub: the code-host and tracker capabilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.7.22"] # released together; the release process bumps the bound

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-github"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
github = "heinzel_github"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
