[project]
name = "heinzel-zoom"
version = "0.7.2"
description = "Read meetings from Zoom's meeting-summary emails: the meetings capability."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.7.2"] # released together; the release process bumps the bound

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-zoom"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
zoom = "heinzel_zoom"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
