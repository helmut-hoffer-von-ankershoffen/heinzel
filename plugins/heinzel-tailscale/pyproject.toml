[project]
name = "heinzel-tailscale"
version = "0.7.26"
description = "Share the authenticated web app privately through Tailscale Serve: a Heinzelmännchen plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.7.26", "httpx>=0.28"]

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-tailscale"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
tailscale = "heinzel_tailscale"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
