[project]
name = "heinzel-atlassian"
version = "0.7.20"
description = "Read Jira issues and Confluence pages through acli: the tracker and documents capabilities."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.7.20"] # released together; the release process bumps the bound

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-atlassian"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
atlassian = "heinzel_atlassian"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
