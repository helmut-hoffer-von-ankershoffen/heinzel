[project]
name = "heinzel-clock"
version = "0.7.10"
description = "What time it is for everyone on the team: a Heinzelmännchen plugin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["heinzel>=0.7.10"] # released together; the release process bumps the bound

[project.urls]
Source = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/tree/main/plugins/heinzel-clock"
Changelog = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/blob/main/CHANGELOG.md"
Issues = "https://github.com/helmut-hoffer-von-ankershoffen/heinzel/issues"

[project.entry-points."heinzel.modules"]
clock = "heinzel_clock"

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"
